name: 🏷️ Plugin Release

on:
  push:
    tags: ["*-v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: 🎁 Create plugin GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve plugin group and version from tag
        id: resolve
        run: |
          TAG="${GITHUB_REF_NAME}"
          GROUP="${TAG%-v*}"
          VERSION="${TAG##*-v}"
          case "$GROUP" in
            self-assess|confab|compass|cupertino|andon|cli-scaffold|codebase-consistency|takt) ;;
            *) echo "Unknown plugin group '$GROUP' from tag '$TAG'"; exit 1 ;;
          esac
          echo "group=$GROUP" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        run: |
          .github/scripts/extract-changelog-section.sh \
            "plugins/${{ steps.resolve.outputs.group }}/CHANGELOG.md" \
            "${{ steps.resolve.outputs.version }}" > release-notes.md

      - name: Build plugin zip
        run: |
          GROUP="${{ steps.resolve.outputs.group }}"
          VERSION="${{ steps.resolve.outputs.version }}"
          cd plugins && zip -r "../${GROUP}-v${VERSION}.zip" "$GROUP"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: "${{ steps.resolve.outputs.group }}-v${{ steps.resolve.outputs.version }}-sbom.spdx.json"
          path: "plugins/${{ steps.resolve.outputs.group }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: "${{ steps.resolve.outputs.group }} v${{ steps.resolve.outputs.version }}"
          body_path: release-notes.md
          append_body: true
          generate_release_notes: true
          files: |
            ${{ steps.resolve.outputs.group }}-v${{ steps.resolve.outputs.version }}.zip
            ${{ steps.resolve.outputs.group }}-v${{ steps.resolve.outputs.version }}-sbom.spdx.json
