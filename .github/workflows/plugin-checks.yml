name: Plugin Checks

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**", "docs/**", "refactor/**", "test/**", "ci/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  checks:
    name: Validate plugin content
    runs-on: ubuntu-latest
    outputs:
      manifests: ${{ steps.manifests.outcome }}
      plugin_authors: ${{ steps.plugin_authors.outcome }}
      frontmatter: ${{ steps.frontmatter.outcome }}
      js_syntax: ${{ steps.js_syntax.outcome }}
      viewer_conformance: ${{ steps.viewer_conformance.outcome }}
      design_tokens: ${{ steps.design_tokens.outcome }}
      readme_skeleton: ${{ steps.readme_skeleton.outcome }}
      symbol_indexer_tests: ${{ steps.symbol_indexer_tests.outcome }}
      catalog_recipes: ${{ steps.catalog_recipes.outcome }}
      docs_audit_tests: ${{ steps.docs_audit_tests.outcome }}
      docs_ux_audit: ${{ steps.docs_ux_audit.outcome }}
      takt_payload_shapes: ${{ steps.takt_payload_shapes.outcome }}
      andon_tests: ${{ steps.andon_tests.outcome }}
      guard_hook_tests: ${{ steps.guard_hook_tests.outcome }}
      ledger_validator_tests: ${{ steps.ledger_validator_tests.outcome }}
      differential_guards: ${{ steps.differential_guards.outcome }}
      hooks_deny: ${{ steps.hooks_deny.outcome }}
      rrt_artifacts: ${{ steps.rrt_artifacts.outcome }}
      docs_inject_check: ${{ steps.docs_inject_check.outcome }}
      release_wiring: ${{ steps.release_wiring.outcome }}
      tag_releases: ${{ steps.tag_releases.outcome }}
      rrt_branch_name: ${{ steps.rrt_branch_name.outcome }}
      pre_commit: ${{ steps.pre_commit.outcome }}
      arbeitsplan_selftests: ${{ steps.arbeitsplan_selftests.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install rrt
        run: uv tool install "repo-release-tools>=1.18.0"

      - name: Install pre-commit
        run: uv tool install pre-commit

      - name: Run pre-commit hooks
        id: pre_commit
        continue-on-error: true
        # rrt-branch-name is skipped here and verified separately below:
        # GitHub Actions checks out the PR's detached-HEAD merge ref, so a
        # plain `pre-commit run` can't see the real head branch name the way
        # github.head_ref can.
        #
        # Two invocations, not one: rrt-doctor's own hook manifest pins it to
        # `stages: [manual]`, so it never runs under a plain `pre-commit run`
        # (locally or in CI) despite sitting in .pre-commit-config.yaml next
        # to hooks that do -- the exact "configured but never invoked" shape
        # this repo has been burned by before. `--hook-stage manual` is the
        # only way to actually exercise it.
        env:
          SKIP: rrt-branch-name
        run: |
          pre-commit run --all-files --show-diff-on-failure
          pre-commit run --all-files --hook-stage manual --show-diff-on-failure

      - name: Validate branch name
        id: rrt_branch_name
        continue-on-error: true
        # Mirrors the branch-name step of Anselmoo/repo-release-tools' own
        # composite action (rrt-hooks check-branch-name), run via the CLI
        # already installed above instead of pulling in a second action.
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: rrt-hooks check-branch-name --branch "$BRANCH_NAME"

      - name: Validate plugin/marketplace manifests
        id: manifests
        continue-on-error: true
        run: ./scripts/ci/check-plugin-manifests.sh

      - name: Validate plugin author attribution against marketplace.json
        id: plugin_authors
        continue-on-error: true
        # marketplace.json credits "Anselm Hahn" correctly for every plugin,
        # but the Claude Code plugin UI displays each per-plugin manifest's
        # own author field -- three of those (andon, zeugnis, befund)
        # were found still carrying scaffold placeholders ("andon plugin",
        # "zeugnis contributors", "befund contributors" / noreply@
        # example.com) that nothing had ever compared against marketplace.json.
        run: python3 test/plugins/lint-plugin-authors.py

      - name: Validate SKILL.md/agent frontmatter
        id: frontmatter
        continue-on-error: true
        run: python3 scripts/ci/check_frontmatter.py

      - name: Check workflow JS syntax
        id: js_syntax
        continue-on-error: true
        run: ./scripts/ci/check-js-syntax.sh

      - name: Check report-viewer conformance
        id: viewer_conformance
        continue-on-error: true
        # docs/plugin-authoring/references/report-viewer-standard.md, mechanical
        # rules only (R1, R4, S1, S2, C1, C2). The eight viewers shared a colour
        # palette and nothing else -- three spellings of the tokens marker, CSP in
        # five of eight, a 61px header constant copy-pasted into three files, and
        # one viewer shipping .legend CSS that nothing used. None of that was
        # visible to any existing check.
        run: python3 scripts/ci/check_viewer_conformance.py

      - name: Check design-token usage (docs theme + report viewers)
        id: design_tokens
        continue-on-error: true
        # docs/plugin-authoring/references/design-tokens.md. The selftest runs
        # first: a lint that cannot fail reports success every run. --base-ref
        # turns a baseline that GREW in this change into a failure, so a new
        # literal cannot be absorbed by raising its count in the same diff. An
        # unreadable ref is a printed WARN, never a silent skip.
        run: |
          git fetch --quiet --depth=1 origin main
          python3 scripts/ci/check_design_tokens.py --selftest
          python3 scripts/ci/check_design_tokens.py --base-ref origin/main

      - name: Check plugin READMEs against the canonical skeleton
        id: readme_skeleton
        continue-on-error: true
        # The P-README-* rules of plugins/nacharbeit/references/rubric.md. They reported
        # 20 findings for months with CI green, because nacharbeit_lint.py exits 0 once
        # a scan completes and nothing called it -- a rule that cannot fail is prose.
        # --fail-on makes exactly this family blocking; the other families stay advisory.
        run: python3 plugins/nacharbeit/scripts/nacharbeit_lint.py plugins/*/ --docs-root docs --fail-on P-README-

      - name: Run symbol-indexer test suite
        id: symbol_indexer_tests
        continue-on-error: true
        working-directory: tools/symbol-indexer
        run: python3 -m unittest test_build_symbol_index -v

      - name: Validate catalog recipes against the capability surface
        id: catalog_recipes
        continue-on-error: true
        # docs/catalog/**/*.md's `beats` name skill/agent ids that must
        # actually exist in docs/.vitepress/data/surface.json -- PR #44
        # introduced the catalog but deliberately left this check out; a
        # renamed or removed skill under plugins/<name>/skills/ would
        # otherwise silently strand a recipe pointing at nothing.
        run: python3 tools/catalog-validator/validate_catalog.py

      - name: Run docs-audit srcExclude parser tests
        id: docs_audit_tests
        continue-on-error: true
        working-directory: test/docs
        # Calibration for the audit's own srcExclude derivation, and it runs
        # BEFORE the audit for the reason lint-release-wiring.py's does: a guard
        # that cannot fail reports success every run and nobody looks again.
        # published_pages() used to keep a second copy of config.mjs's
        # srcExclude list while claiming to honour it -- the release-wiring
        # drift shape (#46 takt, then lehre) in a second place, and it had
        # already bitten, reporting C3 orphans for pages the site never builds.
        run: python3 -m unittest test_docs_ux_audit -v

      - name: Verify docs artifacts are up to date
        id: docs_ux_audit
        continue-on-error: true
        # Catches drifted counts and category mismatches between the docs site
        # content and its configuration data.
        run: python3 test/docs/docs_ux_audit.py

      - name: Verify takt evaluates every edit-payload shape
        id: takt_payload_shapes
        continue-on-error: true
        # verify-hooks-deny.py drives exactly one payload shape
        # ({"tool_name": "Edit", "tool_input": {"file_path": ...}}), which is the
        # right contract for a shared harness but left a real gap: takt's first
        # implementation read only `file_path`, so a MultiEdit carrying its paths
        # in an `edits` array was silently ALLOWED in an opted-in repo. This pins
        # the shapes that harness cannot express.
        run: python3 test/plugins/verify-takt-payload-shapes.py

      - name: Run andon core + hook test suites
        id: andon_tests
        continue-on-error: true
        # Both suites existed and nothing ran them. test_andon_core.py pins
        # route_wire's degradation (a structural wire without an index was
        # routed to numerical V&V, which then demanded a number the wire did
        # not have) and validate_doc's tier_ceiling check, which keeps an
        # index-less run from claiming the non-overridable Tier 1 halt.
        working-directory: plugins/andon
        run: |
          python3 scripts/test_andon_core.py
          python3 hooks/test_andon_enforce.py

      - name: Run befund + zeugnis hook test suites
        id: guard_hook_tests
        continue-on-error: true
        # These existed and ran NOWHERE -- only andon's were wired, so two of
        # the three PreToolUse guards this repo relies on had their suites
        # invoked by hand or not at all. guard_bash_scope.py had no suite until
        # #73; it was the one hook in the family failing H-TEST-EXISTS.
        run: |
          python3 plugins/befund/hooks/test_guard_target_edit.py
          python3 plugins/zeugnis/scripts/hooks/test_guard_edit_scope.py
          python3 plugins/zeugnis/scripts/hooks/test_guard_bash_scope.py

      - name: Run andon-ledger-validator test suite
        id: ledger_validator_tests
        continue-on-error: true
        working-directory: tools/andon-ledger-validator
        # 17 tests that ran nowhere -- flagged at .cupertino/HANDBOOK_CHECK-code.md:25
        # ("Test file not invoked by any CI workflow step") and never acted on. The
        # tool itself stays deliberately unwired from andon-loop per its own README;
        # that is a different question from whether its tests run.
        run: python3 -m unittest test_validate_ledger -v

      - name: Verify guard fixes changed one decision and kept another
        id: differential_guards
        continue-on-error: true
        # A hook fix that only loosens and a hook fix that works are the same
        # diff: both delete a deny. What separates them is whether some other
        # input is STILL refused. Each case declares an (old, new) pair and the
        # runner replays it against the guard at a pinned base commit and at
        # the working tree.
        #
        # The calibration runs first, for the reason release_wiring and
        # tag_releases both state: an instrument that cannot fail reports
        # success every run and nobody looks again. It earned that during its
        # own construction -- it caught a path bug in itself, and then caught
        # that its vacuity check was passing against a fixture that never
        # committed the fixed guard.
        run: |
          python3 test/plugins/differential-guard-cases.py --selftest
          python3 test/plugins/differential-guard-cases.py

      - name: Verify every declared hook actually denies
        id: hooks_deny
        continue-on-error: true
        # Gate 2b, never wired into CI until now -- it lived in plugin READMEs
        # as a by-hand step, which is how it came to be silently broken: the
        # #91 rename moved plugins/{confab,self-assess} to {zeugnis,befund} but
        # left test/plugins/fixtures/hook-violation-{confab,self-assess}/ under
        # their old names, with their locks still at analysis/confab/ and
        # analysis/self-assess/. Fixtures are discovered as
        # hook-violation-<plugin>, so both fell back to the generic fixture and
        # reported "FAIL: allows a violating edit" for three scope-conditional
        # hooks -- a false negative nothing was watching.
        run: python3 test/plugins/verify-hooks-deny.py plugins/*/

      - name: Verify every plugin is wired into the release workflows
        id: release_wiring
        continue-on-error: true
        # Adding a plugin means adding its name to four separate lists, and
        # three of them had nothing comparing them to anything. That drift has
        # shipped twice: #46 for takt, and again for lehre, caught by review
        # rather than by CI. A missing plugin-release.yml allowlist entry fails
        # loudly at tag time; a missing auto-version-bump.yml matcher does not
        # fail at all -- it silently skips the group, which is worse.
        # The calibration runs first: a drift guard that cannot fail reports
        # success every run and nobody looks again. Its own first run caught the
        # guard failing on werkstoff-cli, a legitimate non-plugin version group.
        run: |
          python3 test/plugins/test-lint-release-wiring.py
          python3 test/plugins/lint-release-wiring.py

      - name: Verify vendored artifacts match their committed lock
        id: rrt_artifacts
        continue-on-error: true
        # Catches issue #24's exact failure mode on the next fresh checkout:
        # a .gitignore regression that silently drops a vendored file (e.g.
        # a plugin's scripts/lib/ canary) leaves the lock expecting a file
        # that no longer exists, which --strict turns into a hard failure
        # here instead of a hook denying every edit months later.
        run: rrt artifacts --check --strict

      - name: Verify README shared blocks have not drifted
        id: docs_inject_check
        continue-on-error: true
        # `[[tool.rrt.docs.shared_blocks]]` in .rrt.toml injects the same
        # `## Example Prompts` framing sentence into every plugin README's
        # `<!-- rrt:auto:start:... --> / <!-- rrt:auto:end:... -->` markers.
        # A hand-edit inside those markers gets silently overwritten by the
        # next `rrt docs inject`, and until now nothing caught the reverse
        # case either -- a marker block that had drifted from the shared
        # source going undetected all the way to release.
        run: rrt docs inject --check

      - name: Verify every release tag has a GitHub Release
        id: tag_releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Both release paths are `on: push: tags`, and a tag pushed with
        # GITHUB_TOKEN creates no event -- so for two months every tag
        # auto-version-bump.yml created was a tag nobody released, with CI green
        # throughout. auto-version-bump now CALLS plugin-release.yml instead of
        # relying on that push, but the invariant itself was unguarded, and
        # cicd.yml's bare-tag path still cannot be reached from CI at all.
        #
        # The calibration runs first, for the reason release_wiring states
        # above: this one is sabotage-tested (blank out the `missing` list and
        # 4 of its 13 cases go red), because a guard whose failure path has
        # never executed is a guard nobody has actually seen work.
        #
        # Tags are fetched explicitly: the checkout above is shallow and carries
        # none, and "no tags" is indistinguishable from "nothing released" --
        # which the guard treats as an error rather than a pass.
        run: |
          git fetch --tags --quiet origin
          python3 test/plugins/test-lint-tag-releases.py
          python3 test/plugins/lint-tag-releases.py

      - name: Run arbeitsplan selftests
        id: arbeitsplan_selftests
        continue-on-error: true
        # compile_spec.py --selftest also invokes test_red_fixtures.py itself
        # (no --baseline here: this checkout is shallow, so there is no history
        # to `git archive` a baseline commit from). Every script below carries its
        # own planted-defect selftest; a selftest CI never runs gates nothing.
        # test_run_workflow.js executes workflows/run.js against stub agents,
        # including its sabotage cases (#81's render, #78's halt payload).
        run: |
          python3 plugins/arbeitsplan/scripts/compile_spec.py --selftest
          python3 plugins/arbeitsplan/scripts/land_candidate.py --selftest
          python3 plugins/arbeitsplan/scripts/worktree_pool.py selftest
          python3 plugins/arbeitsplan/scripts/test_red_fixtures.py
          node plugins/arbeitsplan/scripts/test_run_workflow.js
          python3 plugins/arbeitsplan/scripts/reconcile.py --selftest
          python3 plugins/arbeitsplan/scripts/sweep_artifacts.py --selftest
          python3 plugins/arbeitsplan/scripts/record_event.py selftest
          python3 plugins/arbeitsplan/scripts/rounds.py --selftest

      - name: Fail the job if any check failed
        if: |
          steps.manifests.outcome == 'failure' ||
          steps.plugin_authors.outcome == 'failure' ||
          steps.frontmatter.outcome == 'failure' ||
          steps.js_syntax.outcome == 'failure' ||
          steps.viewer_conformance.outcome == 'failure' ||
          steps.design_tokens.outcome == 'failure' ||
          steps.readme_skeleton.outcome == 'failure' ||
          steps.symbol_indexer_tests.outcome == 'failure' ||
          steps.catalog_recipes.outcome == 'failure' ||
          steps.docs_audit_tests.outcome == 'failure' ||
          steps.docs_ux_audit.outcome == 'failure' ||
          steps.takt_payload_shapes.outcome == 'failure' ||
          steps.andon_tests.outcome == 'failure' ||
          steps.guard_hook_tests.outcome == 'failure' ||
          steps.ledger_validator_tests.outcome == 'failure' ||
          steps.differential_guards.outcome == 'failure' ||
          steps.hooks_deny.outcome == 'failure' ||
          steps.rrt_artifacts.outcome == 'failure' ||
          steps.release_wiring.outcome == 'failure' ||
          steps.tag_releases.outcome == 'failure' ||
          steps.docs_inject_check.outcome == 'failure' ||
          steps.rrt_branch_name.outcome == 'failure' ||
          steps.pre_commit.outcome == 'failure' ||
          steps.arbeitsplan_selftests.outcome == 'failure'
        run: exit 1

  board:
    name: Render Andon Board
    needs: checks
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Build board markdown
        id: render
        run: |
          # Raw HTML, not a GFM pipe table: a lone status emoji in a table
          # cell (🟢/🔴/⚪) gets GitHub's "sole emoji content" auto-enlarge
          # treatment, which is what made the old board's circles huge and
          # misaligned. A small shields.io badge <img> sidesteps that --
          # GitHub camo-proxies it server-side, so viewers make no direct
          # third-party request.
          row() {
            local label="$1" outcome="$2" alt msg color
            case "$outcome" in
              success) alt="passing"; msg="pass"; color="2ea44f" ;;
              failure) alt="failing"; msg="fail"; color="cf222e" ;;
              *)       alt="skipped"; msg="skipped"; color="8c959f" ;;
            esac
            echo "<tr><td>$label</td><td align=\"center\"><img alt=\"$alt\" src=\"https://img.shields.io/badge/$msg-$color?style=flat-square\"></td></tr>"
          }
          table_open() {
            echo "<table><thead><tr><th align=\"left\">$1</th><th align=\"center\">Status</th></tr></thead><tbody>"
          }
          {
            echo "<!-- andon-board -->"
            echo "<h3>🚦 Plugin Andon Board</h3>"
            echo
            echo "<h4>🤖 CI checks</h4>"
            table_open "Check"
            row "Plugin/marketplace manifests" "${{ needs.checks.outputs.manifests }}"
            row "Plugin author attribution vs. marketplace.json" "${{ needs.checks.outputs.plugin_authors }}"
            row "SKILL.md/agent frontmatter" "${{ needs.checks.outputs.frontmatter }}"
            row "Workflow JS syntax" "${{ needs.checks.outputs.js_syntax }}"
            row "Report-viewer conformance" "${{ needs.checks.outputs.viewer_conformance }}"
            row "Design-token usage (docs theme + viewers)" "${{ needs.checks.outputs.design_tokens }}"
            row "Plugin READMEs vs. canonical skeleton (P-README-*)" "${{ needs.checks.outputs.readme_skeleton }}"
            row "symbol-indexer test suite" "${{ needs.checks.outputs.symbol_indexer_tests }}"
            row "catalog recipes vs. capability surface" "${{ needs.checks.outputs.catalog_recipes }}"
            row "docs-audit srcExclude tests" "${{ needs.checks.outputs.docs_audit_tests }}"
            row "docs artifacts up to date" "${{ needs.checks.outputs.docs_ux_audit }}"
            row "takt payload shapes" "${{ needs.checks.outputs.takt_payload_shapes }}"
            row "andon core + hook test suites" "${{ needs.checks.outputs.andon_tests }}"
            row "befund + zeugnis hook test suites" "${{ needs.checks.outputs.guard_hook_tests }}"
            row "andon-ledger-validator test suite" "${{ needs.checks.outputs.ledger_validator_tests }}"
            row "guard differential cases (old denies / new allows, and one both deny)" "${{ needs.checks.outputs.differential_guards }}"
            row "declared hooks actually deny (verify-hooks-deny)" "${{ needs.checks.outputs.hooks_deny }}"
            row "rrt artifacts (vendored-file drift)" "${{ needs.checks.outputs.rrt_artifacts }}"
            row "plugin release wiring (.rrt.toml vs. workflows)" "${{ needs.checks.outputs.release_wiring }}"
            row "release tags vs. published GitHub Releases" "${{ needs.checks.outputs.tag_releases }}"
            row "README shared blocks (rrt docs inject --check)" "${{ needs.checks.outputs.docs_inject_check }}"
            row "arbeitsplan selftests (compiler, landing, pool, runner, reconcile, sweep, record, rounds)" "${{ needs.checks.outputs.arbeitsplan_selftests }}"
            echo "</tbody></table>"
            echo
            echo "<h4>🪝 Pre-commit hooks (<code>.pre-commit-config.yaml</code>)</h4>"
            table_open "Hook"
            row "rrt-branch-name" "${{ needs.checks.outputs.rrt_branch_name }}"
            row "rrt-config-validate, rrt-doctor, check-js-syntax, check-js-syntax-selftest, check-design-tokens, check-design-tokens-selftest (<code>pre-commit run --all-files</code>)" "${{ needs.checks.outputs.pre_commit }}"
            echo "</tbody></table>"
          } > board.md
          cat board.md

      - name: Post or update sticky PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const body = fs.readFileSync('board.md', 'utf8')
            const marker = '<!-- andon-board -->'
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const existing = comments.find(c => c.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }
