name: 🔢 Auto Version Bump

# Automatically bumps the rrt version group(s) whose paths changed in a push
# to main, using the conventional-commit type of that push's head commit to
# pick the bump level (feat -> minor, fix -> patch, "!"/BREAKING CHANGE ->
# major). Any other commit type (chore, docs, refactor, ...), or a commit
# whose message doesn't start with a recognized type at all, is skipped
# entirely -- no bump is a safe default, a wrong bump is not. This means a
# squash-merge commit/PR title MUST start with a conventional-commit type
# for its merge to auto-bump anything; a plain-English title (as used by
# this repo's own PR #1) is silently skipped, by design.
#
# rrt bump itself always creates a release/<group>/v<version> branch and
# commits on it (no in-place-on-current-branch mode) -- this workflow fast-
# forward-merges that branch onto main, tags each bumped group
# (`rrt tag create --group <g> --prefix '<g>-v' --push`), and pushes once,
# per push event -- so a single push touching N groups produces N tags in
# one CI run, each of which independently fans out to plugin-release.yml.
#
# Also callable as a reusable workflow (workflow_call) with an explicit
# `groups_and_levels` input ("group:level,group:level", e.g. for a manual
# drift-correction batch that deliberately uses chore: commits to avoid
# double-bumping -- see .github/workflows/batch-release.yml) instead of
# sniffing the trigger commit. Both paths converge on the same
# "Normalize groups_and_levels for this run" step below, so the bump/tag
# loop itself never needs to know which trigger fired it.

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      groups_and_levels:
        description: "Comma-separated group:level pairs, e.g. 'confab:patch,compass:patch'"
        required: true
        type: string
    outputs:
      bumped_groups:
        description: "Space-separated list of groups that were bumped"
        value: ${{ jobs.bump.outputs.bumped_groups }}

permissions:
  contents: write

concurrency:
  group: auto-version-bump-main
  cancel-in-progress: false

jobs:
  bump:
    name: Bump changed version group(s)
    runs-on: ubuntu-latest
    outputs:
      bumped_groups: ${{ steps.bump.outputs.bumped_groups }}
    # Guard against re-triggering on the bump commit(s) this workflow itself
    # pushes -- rrt bump's generated commit message is always exactly
    # "chore: bump version to v<version>". Only applies to the push trigger;
    # a workflow_call invocation (the manual batch-release path) has no
    # head_commit to sniff and is never self-triggered this way.
    if: "${{ github.event_name == 'workflow_call' || !startsWith(github.event.head_commit.message, 'chore: bump version to v') }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install rrt
        run: uv tool install "repo-release-tools>=1.13.1"

      - name: Determine bump level from the head commit's conventional-commit type
        id: level
        # NOT `github.event_name != 'workflow_call'` -- confirmed against
        # GitHub's own docs ("the github context is consistently associated
        # with the caller workflow"): when this workflow is invoked via
        # batch-release.yml's `uses:`, github.event_name is the CALLER's
        # trigger (workflow_dispatch), never 'workflow_call'. That check was
        # therefore always true even on the explicit-input path, so this
        # step always ran and the "Normalize" step below always ignored
        # groups_and_levels in favor of sniffing HEAD~1..HEAD -- confirmed
        # live: a real dispatch with an explicit six-group input resolved to
        # "Resolved pairs: '<none>'". inputs.groups_and_levels is empty on a
        # plain push (workflow_call inputs don't populate outside that
        # event), so checking it directly is the actual reliable signal.
        if: inputs.groups_and_levels == ''
        env:
          # GitHub Actions expression interpolation (${{ ... }}) splices its
          # value directly into the shell script's TEXT before bash ever
          # parses it -- it is not passed as a safely-quoted variable. Used
          # inline inside `run:`, an arbitrary multi-line commit message
          # containing quotes/backticks/parens/`$()` can break the script's
          # syntax outright, or worse, inject arbitrary shell commands. This
          # already broke a real run: PR #3's own commit message (which
          # itself discusses this exact class of bug) hit exactly this,
          # aborting with "syntax error near unexpected token '('". Routing
          # untrusted-shaped values through `env:` and referencing them as
          # normal `"$VAR"` inside the script is the documented-safe pattern.
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          FIRST_LINE=$(echo "$HEAD_COMMIT_MESSAGE" | head -1)
          # Anchored to line-start + colon, matching the Conventional Commits
          # footer format exactly (`BREAKING CHANGE: ...`) -- a bare
          # substring search over the whole message is a real trap: prose
          # anywhere in a commit body that merely *mentions* the phrase
          # "BREAKING CHANGE" (e.g. a commit describing this very feature)
          # would false-positive into a major bump. Confirmed via a real
          # incident: this repo's own PR #2, whose squashed commit body
          # explained this detection logic in prose, triggered exactly that.
          if echo "$HEAD_COMMIT_MESSAGE" | grep -qE '^BREAKING[ -]CHANGE:' \
             || echo "$FIRST_LINE" | grep -qE '^[a-z]+(\([a-z0-9_-]+\))?!:'; then
            LEVEL=major
          elif echo "$FIRST_LINE" | grep -qE '^feat(\([a-z0-9_-]+\))?:'; then
            LEVEL=minor
          elif echo "$FIRST_LINE" | grep -qE '^fix(\([a-z0-9_-]+\))?:'; then
            LEVEL=patch
          else
            LEVEL=""
          fi
          echo "level=$LEVEL" >> "$GITHUB_OUTPUT"
          echo "Detected bump level: '${LEVEL:-<none, no recognized conventional-commit type>}'"

      - name: Determine which version groups changed
        id: groups
        if: inputs.groups_and_levels == '' && steps.level.outputs.level != ''
        run: |
          # NOTE: GROUPS is a bash-reserved special variable (auto-populated
          # with the current user's OS group IDs) -- naming a plain variable
          # GROUPS silently collides with it instead of raising an error, so
          # this uses MATCHED_GROUPS throughout instead.
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          MATCHED_GROUPS=""
          echo "$CHANGED" | grep -q '^plugins/self-assess/' && MATCHED_GROUPS="$MATCHED_GROUPS self-assess"
          echo "$CHANGED" | grep -q '^plugins/confab/' && MATCHED_GROUPS="$MATCHED_GROUPS confab"
          echo "$CHANGED" | grep -q '^plugins/compass/' && MATCHED_GROUPS="$MATCHED_GROUPS compass"
          echo "$CHANGED" | grep -q '^plugins/cupertino/' && MATCHED_GROUPS="$MATCHED_GROUPS cupertino"
          echo "$CHANGED" | grep -q '^plugins/andon/' && MATCHED_GROUPS="$MATCHED_GROUPS andon"
          echo "$CHANGED" | grep -q '^plugins/cli-scaffold/' && MATCHED_GROUPS="$MATCHED_GROUPS cli-scaffold"
          echo "$CHANGED" | grep -q '^plugins/codebase-consistency/' && MATCHED_GROUPS="$MATCHED_GROUPS codebase-consistency"
          echo "$CHANGED" | grep -q '^tools/werkstoff-cli/' && MATCHED_GROUPS="$MATCHED_GROUPS werkstoff-cli"
          MATCHED_GROUPS="$(echo "$MATCHED_GROUPS" | xargs)"
          echo "groups=$MATCHED_GROUPS" >> "$GITHUB_OUTPUT"
          echo "Changed groups: '${MATCHED_GROUPS:-<none>}'"

      - name: Normalize groups_and_levels for this run
        id: pairs
        env:
          CALL_INPUT: ${{ inputs.groups_and_levels }}
          PUSH_LEVEL: ${{ steps.level.outputs.level }}
          PUSH_GROUPS: ${{ steps.groups.outputs.groups }}
        run: |
          # Unifies both trigger shapes into one "group:level,group:level"
          # format so the bump/tag step below never needs to know which
          # trigger fired it. workflow_call already arrives in exactly that
          # shape; the push trigger applies its single detected LEVEL to
          # every changed GROUP to build the same shape.
          #
          # Branches on CALL_INPUT itself, NOT EVENT_NAME -- see the
          # comment on the "Determine bump level" step above: EVENT_NAME is
          # always the CALLER's trigger for a workflow invoked via `uses:`,
          # never 'workflow_call', so this branch was previously dead code.
          if [ -n "$CALL_INPUT" ]; then
            PAIRS="$CALL_INPUT"
          elif [ -n "$PUSH_LEVEL" ] && [ -n "$PUSH_GROUPS" ]; then
            PAIRS=""
            for GROUP in $PUSH_GROUPS; do
              PAIRS="$PAIRS,$GROUP:$PUSH_LEVEL"
            done
            PAIRS="${PAIRS#,}"
          else
            PAIRS=""
          fi
          echo "pairs=$PAIRS" >> "$GITHUB_OUTPUT"
          echo "Resolved pairs: '${PAIRS:-<none>}'"

      - name: Bump, tag, and fast-forward-merge each group
        id: bump
        if: steps.pairs.outputs.pairs != ''
        run: |
          set -euo pipefail
          BUMPED=""
          IFS=',' read -ra GROUP_LEVEL_PAIRS <<< "${{ steps.pairs.outputs.pairs }}"
          for PAIR in "${GROUP_LEVEL_PAIRS[@]}"; do
            GROUP="${PAIR%%:*}"
            LEVEL="${PAIR##*:}"
            echo "::group::Bumping $GROUP ($LEVEL)"
            rrt bump "$LEVEL" --group "$GROUP"
            BRANCH=$(git branch --list "release/$GROUP/v*" --format='%(refname:short)' | tail -1)
            git checkout main
            git merge --ff-only "$BRANCH"
            git branch -D "$BRANCH"
            echo "::endgroup::"
            echo "::group::Tagging $GROUP"
            # werkstoff-cli is the one group that MUST use the bare v<version>
            # scheme (see .rrt.toml's header comment): a bare tag is what
            # cicd.yml's `tags: ["v*.*.*"]` trigger listens for, and it does
            # NOT match plugin-release.yml's `*-v*.*.*` pattern. Every other
            # group must stay prefixed, or a bare tag here would wrongly fire
            # cicd.yml's PyPI publish job for a plugin bump.
            if [ "$GROUP" = "werkstoff-cli" ]; then
              rrt tag create --group "$GROUP" --push
            else
              rrt tag create --group "$GROUP" --prefix "$GROUP-v" --push
            fi
            echo "::endgroup::"
            BUMPED="$BUMPED $GROUP"
          done
          git push origin main
          echo "bumped_groups=$(echo "$BUMPED" | xargs)" >> "$GITHUB_OUTPUT"
