<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Consistency Matrix</title>
<!--__DESIGN_TOKENS__-->
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: var(--font-size-base);
  }
  header {
    padding: var(--space-4) var(--space-5);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: var(--space-4);
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 600;
    color: var(--accent);
  }
  header .sub {
    color: var(--muted);
    font-size: 12px;
  }
  .controls {
    margin-left: auto;
    display: flex;
    gap: var(--space-3);
    align-items: center;
  }
  input[type="text"] {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    width: 200px;
  }
  select {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 8px;
    border-radius: var(--radius-sm);
    font-size: 13px;
  }
  .layout {
    display: flex;
    height: calc(100vh - 61px);
  }
  .matrix-wrap {
    flex: 1;
    overflow: auto;
    padding: var(--space-4) var(--space-5);
  }
  .matrix-grid {
    display: grid;
  }
  .corner, .col-header, .row-label {
    background: var(--panel-2);
    font-size: 12px;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .corner {
    position: sticky;
    top: 0;
    left: 0;
    z-index: 4;
  }
  .col-header {
    position: sticky;
    top: 0;
    z-index: 2;
    cursor: pointer;
    user-select: none;
  }
  .col-header:hover { color: var(--accent); }
  .row-label {
    position: sticky;
    left: 0;
    z-index: 1;
    font-weight: 500;
    cursor: pointer;
  }
  .row-label:hover { color: var(--accent); }
  .cells-svg {
    grid-column: 2 / -1;
    grid-row: 2 / -1;
    display: block;
  }
  .cell-rect {
    stroke: var(--border);
    stroke-width: 1;
    cursor: pointer;
  }
  .cell-rect:hover {
    stroke: var(--accent);
    stroke-width: 2;
  }
  .cell-rect.selected {
    stroke: var(--text);
    stroke-width: 2;
  }
  .cell-text {
    font-size: 10px;
    fill: rgba(255,255,255,0.85);
    pointer-events: none;
    text-anchor: middle;
    dominant-baseline: middle;
  }
  .sidebar {
    width: 340px;
    border-left: 1px solid var(--border);
    background: var(--panel);
    padding: 18px;
    overflow-y: auto;
    flex-shrink: 0;
  }
  .sidebar h2 {
    font-size: 14px;
    margin: 0 0 4px;
    color: var(--accent);
  }
  .sidebar .meta-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  .sidebar .meta-row .k { color: var(--muted); }
  .sidebar .example {
    margin-top: 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    color: var(--text);
    word-break: break-all;
  }
  .sidebar .placeholder {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
    margin-top: 40px;
  }
  .legend {
    display: flex;
    gap: 14px;
    padding: 10px 20px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--muted);
    align-items: center;
    flex-wrap: wrap;
  }
  .legend .swatch {
    width: 12px;
    height: 12px;
    display: inline-block;
    border-radius: 2px;
    margin-right: 5px;
    vertical-align: middle;
  }
  .stat-row { display: flex; gap: 14px; flex-wrap: wrap; padding: 0 20px 14px; }
  .stat {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-control);
    padding: 12px 18px; min-width: 110px;
  }
  .stat .v { font-size: 22px; font-weight: 600; color: var(--accent); }
  .stat .k { font-size: 11px; color: var(--muted); margin-top: 2px; }
</style>
</head>
<body>

<header>
  <h1 id="title">Consistency Matrix</h1>
  <span class="sub" id="subtitle"></span>
  <div class="controls">
    <input type="text" id="filterInput" placeholder="filter modules or dimensions…">
    <select id="sortMode">
      <option value="worst-module">sort: worst module first</option>
      <option value="worst-dimension">sort: worst dimension first</option>
      <option value="alpha">sort: alphabetical</option>
    </select>
  </div>
</header>

<div class="stat-row" id="statRow"></div>

<div class="layout">
  <div class="matrix-wrap">
    <div class="matrix-grid" id="matrixGrid"></div>
  </div>
  <div class="sidebar" id="sidebar">
    <div class="placeholder">Click a cell to see its detail — module, dimension, variant in use, and site count. Once /consistency-canonize has run, cell color shows distance from the chosen canon; before that, color shows variant-cluster identity.</div>
  </div>
</div>

<div class="legend" id="legend"></div>
<div id="err" class="panel" style="position:absolute;inset:0;display:none;place-items:center;z-index:9;"><p></p></div>

<!--__D3_SUBSET__-->
<script type="module">
const d3 = window.d3;

// The build script in /consistency-map replaces everything from the comment
// marker onward on this line with the real JSON literal — so after
// injection this becomes `const MATRIX_DATA_RAW = /*__MATRIX_DATA__*/ {...};`.
const MATRIX_DATA_RAW = /*__MATRIX_DATA__*/ null;

if (!MATRIX_DATA_RAW || !MATRIX_DATA_RAW.modules) {
  const err = document.getElementById('err');
  err.querySelector('p').innerHTML =
    'No matrix data found in this file.<br>Re-run <code>/consistency-map</code> to regenerate it.';
  err.style.display = 'grid';
  document.querySelector('.layout').style.display = 'none';
  document.querySelector('.legend').style.display = 'none';
  throw new Error('no data');
}
const MATRIX = MATRIX_DATA_RAW;

document.getElementById('title').textContent = 'Consistency Matrix — ' + (MATRIX.area || '');
document.getElementById('subtitle').textContent =
  MATRIX.modules.length + ' modules × ' + MATRIX.dimensions.length + ' dimensions';

// ---- grid geometry -------------------------------------------------------
// CELL_W/CELL_H match the original table's `min-width:92px; height:40px`
// cell sizing exactly, so this rebuild changes rendering technique, not
// visual density.
const CELL_W = 92;
const CELL_H = 40;
const HEADER_H = 40;
const ROW_LABEL_W = 180;

// ---- palette per variant (stable hash → hue) ------------------------------
// Not part of the shared token system — these are arbitrary hashed hues for
// distinguishing variant identity before /consistency-canonize has run.
// tokens.css now ships a categorical scale (--cat-1..5), but it only covers
// 5 hues against this PALETTE's 8; migrating this hashed lookup onto
// --cat-1..5 plus a fallback for the 3 extra hues is a follow-up, not done
// in this change.
const VARIANT_COLORS = {};
const PALETTE = ['#5b7fa6', '#7a9e6b', '#c98f4a', '#a5648a', '#5a9e9e', '#9e7a5a', '#7a7a9e', '#9e5a5a'];
function colorForVariant(label) {
  if (VARIANT_COLORS[label]) return VARIANT_COLORS[label];
  let h = 0;
  for (let i = 0; i < label.length; i++) h = (h * 31 + label.charCodeAt(i)) >>> 0;
  const c = PALETTE[h % PALETTE.length];
  VARIANT_COLORS[label] = c;
  return c;
}
function colorForConformance(c) {
  if (c >= 0.85) return getCss('--status-good');
  if (c >= 0.4) return getCss('--status-warn');
  return getCss('--status-bad');
}
function getCss(varName) {
  return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
}

// ---- index cells for O(1) lookup ------------------------------------------
const cellIndex = new Map();
for (const c of (MATRIX.cells || [])) {
  cellIndex.set(c.module + '\u0000' + c.dimension, c);
}

const hasConformance = (MATRIX.cells || []).some(c => typeof c.conformance === 'number');

function renderStatRow() {
  const row = document.getElementById('statRow');
  const cells = MATRIX.cells || [];
  const totalSites = cells.reduce((s, c) => s + (c.sites || 0), 0);
  const stats = [
    ['Modules', MATRIX.modules.length],
    ['Dimensions', MATRIX.dimensions.length],
    ['Divergent cells', cells.length],
    ['Total sites', totalSites],
  ];
  if (hasConformance) {
    const withConf = cells.filter(c => typeof c.conformance === 'number');
    const avg = withConf.length ? withConf.reduce((s, c) => s + c.conformance, 0) / withConf.length : 0;
    stats.push(['Avg. conformance', Math.round(avg * 100) + '%']);
  }
  for (const [k, v] of stats) {
    const stat = document.createElement('div');
    stat.className = 'stat';
    stat.innerHTML = '<div class="v">' + v + '</div><div class="k">' + k + '</div>';
    row.appendChild(stat);
  }
}
renderStatRow();

// ---- sorting ---------------------------------------------------------------
function moduleDivergenceScore(mod) {
  let score = 0;
  for (const dim of MATRIX.dimensions) {
    const c = cellIndex.get(mod + '\u0000' + dim);
    if (!c) continue;
    score += hasConformance ? (1 - (c.conformance ?? 0.5)) : 1;
  }
  return score;
}
function dimensionDivergenceScore(dim) {
  let score = 0;
  for (const mod of MATRIX.modules) {
    const c = cellIndex.get(mod + '\u0000' + dim);
    if (!c) continue;
    score += hasConformance ? (1 - (c.conformance ?? 0.5)) : 1;
  }
  return score;
}

let sortMode = 'worst-module';
let filterText = '';

function computeOrder() {
  let modules = [...MATRIX.modules];
  let dimensions = [...MATRIX.dimensions];
  if (filterText) {
    const f = filterText.toLowerCase();
    modules = modules.filter(m => m.toLowerCase().includes(f));
    dimensions = dimensions.filter(d => d.toLowerCase().includes(f));
    // if filter matches only dimensions or only modules, keep the other axis full
    if (modules.length === 0) modules = [...MATRIX.modules];
    if (dimensions.length === 0) dimensions = [...MATRIX.dimensions];
  }
  if (sortMode === 'worst-module') {
    modules.sort((a, b) => moduleDivergenceScore(b) - moduleDivergenceScore(a));
  } else if (sortMode === 'worst-dimension') {
    dimensions.sort((a, b) => dimensionDivergenceScore(b) - dimensionDivergenceScore(a));
  } else {
    modules.sort();
    dimensions.sort();
  }
  return { modules, dimensions };
}

// ---- render ------------------------------------------------------------------
// Sticky row-label/column-header cells stay plain HTML `<div>`s in a CSS
// Grid (so `position: sticky` keeps working exactly like the old table's
// `th`/`td.row-label`); only the colored data cells are drawn as one `<svg>`
// populated via a real d3 data-join, per the cupertino verdict.
let selectedRect = null;

function render() {
  const { modules, dimensions } = computeOrder();
  const grid = document.getElementById('matrixGrid');
  grid.innerHTML = '';
  selectedRect = null;

  grid.style.gridTemplateColumns = ROW_LABEL_W + 'px repeat(' + dimensions.length + ', ' + CELL_W + 'px)';
  grid.style.gridTemplateRows = HEADER_H + 'px repeat(' + modules.length + ', ' + CELL_H + 'px)';

  const corner = document.createElement('div');
  corner.className = 'corner';
  corner.textContent = MATRIX.area || 'module \\ dimension';
  corner.style.gridColumn = '1';
  corner.style.gridRow = '1';
  grid.appendChild(corner);

  dimensions.forEach((dim, j) => {
    const h = document.createElement('div');
    h.className = 'col-header';
    h.textContent = dim;
    h.title = 'click to sort by this dimension';
    h.style.gridColumn = String(j + 2);
    h.style.gridRow = '1';
    h.onclick = () => { sortMode = 'worst-dimension'; document.getElementById('sortMode').value = 'worst-dimension'; render(); };
    grid.appendChild(h);
  });

  modules.forEach((mod, i) => {
    const label = document.createElement('div');
    label.className = 'row-label';
    label.textContent = mod;
    label.title = 'click to sort by this module';
    label.style.gridColumn = '1';
    label.style.gridRow = String(i + 2);
    label.onclick = () => { sortMode = 'worst-module'; document.getElementById('sortMode').value = 'worst-module'; render(); };
    grid.appendChild(label);
  });

  // ---- SVG cell grid, D3 data-join ----------------------------------------
  const flat = [];
  modules.forEach((mod, i) => {
    dimensions.forEach((dim, j) => {
      const c = cellIndex.get(mod + '\u0000' + dim) || null;
      flat.push({ mod, dim, i, j, c });
    });
  });

  const svg = d3.select(grid).append('svg')
    .attr('class', 'cells-svg')
    .attr('width', dimensions.length * CELL_W)
    .attr('height', modules.length * CELL_H)
    .attr('viewBox', '0 0 ' + (dimensions.length * CELL_W) + ' ' + (modules.length * CELL_H));

  const defs = svg.append('defs');
  const hatch = defs.append('pattern')
    .attr('id', 'emptyHatch')
    .attr('width', 8).attr('height', 8)
    .attr('patternTransform', 'rotate(45)')
    .attr('patternUnits', 'userSpaceOnUse');
  hatch.append('rect').attr('width', 8).attr('height', 8).attr('fill', getCss('--panel-2'));
  hatch.append('rect').attr('width', 4).attr('height', 8).attr('fill', getCss('--status-unknown')).attr('fill-opacity', 0.35);

  svg.selectAll('rect.cell-rect')
    .data(flat, d => d.mod + '\u0000' + d.dim)
    .join('rect')
    .attr('class', 'cell-rect')
    .attr('x', d => d.j * CELL_W + 1)
    .attr('y', d => d.i * CELL_H + 1)
    .attr('width', CELL_W - 2)
    .attr('height', CELL_H - 2)
    .attr('fill', d => {
      if (!d.c) return 'url(#emptyHatch)';
      return hasConformance && typeof d.c.conformance === 'number'
        ? colorForConformance(d.c.conformance)
        : colorForVariant(d.c.variant || '?');
    })
    .on('click', (event, d) => {
      if (!d.c) return;
      selectCell(event.currentTarget, d.mod, d.dim, d.c);
    })
    .append('title')
    .text(d => d.c ? (d.mod + ' × ' + d.dim) : ('no data for ' + d.mod + ' × ' + d.dim));

  svg.selectAll('text.cell-text')
    .data(flat.filter(d => d.c && d.c.sites != null), d => d.mod + '\u0000' + d.dim)
    .join('text')
    .attr('class', 'cell-text')
    .attr('x', d => d.j * CELL_W + CELL_W / 2)
    .attr('y', d => d.i * CELL_H + CELL_H / 2)
    .text(d => d.c.sites);

  renderLegend();
}

function selectCell(rectEl, mod, dim, cell) {
  if (selectedRect) selectedRect.classList.remove('selected');
  rectEl.classList.add('selected');
  selectedRect = rectEl;

  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '';
  const h = document.createElement('h2');
  h.textContent = dim;
  sidebar.appendChild(h);

  const rows = [
    ['Module', mod],
    ['Variant', cell.variant || '(unknown)'],
    ['Sites', cell.sites != null ? String(cell.sites) : '?'],
  ];
  if (typeof cell.conformance === 'number') {
    rows.push(['Conformance to canon', Math.round(cell.conformance * 100) + '%']);
  }
  for (const [k, v] of rows) {
    const row = document.createElement('div');
    row.className = 'meta-row';
    row.innerHTML = '<span class="k">' + k + '</span><span>' + escapeHtml(String(v)) + '</span>';
    sidebar.appendChild(row);
  }

  if (cell.example) {
    const ex = document.createElement('div');
    ex.className = 'example';
    ex.textContent = cell.example;
    sidebar.appendChild(ex);
  }
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderLegend() {
  const legend = document.getElementById('legend');
  legend.innerHTML = '';
  if (hasConformance) {
    const items = [
      ['--status-good', 'aligned with canon (≥85%)'],
      ['--status-warn', 'partially aligned (40–85%)'],
      ['--status-bad', 'diverges from canon (<40%)'],
    ];
    for (const [varName, label] of items) {
      const span = document.createElement('span');
      const sw = document.createElement('span');
      sw.className = 'swatch';
      sw.style.background = getCss(varName);
      span.appendChild(sw);
      span.appendChild(document.createTextNode(label));
      legend.appendChild(span);
    }
  } else {
    const note = document.createElement('span');
    note.textContent = 'Colors show variant identity — run /consistency-canonize to switch this to a conformance-to-canon scale.';
    legend.appendChild(note);
  }
}

document.getElementById('filterInput').addEventListener('input', e => {
  filterText = e.target.value;
  render();
});
document.getElementById('sortMode').addEventListener('change', e => {
  sortMode = e.target.value;
  render();
});

render();
</script>
</body>
</html>
