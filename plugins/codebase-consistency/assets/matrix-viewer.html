<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consistency Matrix</title>
<style>
  :root {
    --bg: #1e1e1e;
    --bg-panel: #252526;
    --bg-header: #2d2d2d;
    --text: #d4d4d4;
    --text-dim: #8a8a8a;
    --accent: #cc785c;
    --border: #3a3a3a;
    --conform-high: #4c8d5a;
    --conform-mid: #b58b3a;
    --conform-low: #b0503f;
    --conform-unknown: #3a5a7a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 14px;
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 600;
    color: var(--accent);
  }
  header .sub {
    color: var(--text-dim);
    font-size: 12px;
  }
  .controls {
    margin-left: auto;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  input[type="text"] {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 13px;
    width: 200px;
  }
  select {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 8px;
    border-radius: 4px;
    font-size: 13px;
  }
  .layout {
    display: flex;
    height: calc(100vh - 61px);
  }
  .matrix-wrap {
    flex: 1;
    overflow: auto;
    padding: 16px 20px;
  }
  table.matrix {
    border-collapse: collapse;
    font-size: 12px;
  }
  table.matrix th, table.matrix td {
    border: 1px solid var(--border);
    padding: 0;
    text-align: left;
  }
  table.matrix th {
    background: var(--bg-header);
    position: sticky;
    top: 0;
    z-index: 2;
    padding: 8px 10px;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  table.matrix th.row-head {
    position: sticky;
    left: 0;
    z-index: 3;
    top: auto;
  }
  table.matrix th:first-child {
    z-index: 4;
  }
  table.matrix th:hover { color: var(--accent); }
  table.matrix td.row-label {
    background: var(--bg-header);
    position: sticky;
    left: 0;
    z-index: 1;
    padding: 8px 10px;
    font-weight: 500;
    white-space: nowrap;
    cursor: pointer;
  }
  table.matrix td.row-label:hover { color: var(--accent); }
  td.cell {
    min-width: 92px;
    height: 40px;
    cursor: pointer;
    position: relative;
    transition: outline 0.1s;
  }
  td.cell:hover {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }
  td.cell.empty {
    background: repeating-linear-gradient(45deg, #262626, #262626 6px, #2a2a2a 6px, #2a2a2a 12px);
  }
  td.cell .fill {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: rgba(255,255,255,0.85);
    padding: 2px 4px;
    text-align: center;
    overflow: hidden;
  }
  td.cell.selected {
    outline: 2px solid #fff;
    outline-offset: -2px;
  }
  .sidebar {
    width: 340px;
    border-left: 1px solid var(--border);
    background: var(--bg-panel);
    padding: 18px;
    overflow-y: auto;
    flex-shrink: 0;
  }
  .sidebar h2 {
    font-size: 14px;
    margin: 0 0 4px;
    color: var(--accent);
  }
  .sidebar .meta-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  .sidebar .meta-row .k { color: var(--text-dim); }
  .sidebar .example {
    margin-top: 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    color: var(--text);
    word-break: break-all;
  }
  .sidebar .placeholder {
    color: var(--text-dim);
    font-size: 13px;
    line-height: 1.5;
    margin-top: 40px;
  }
  .legend {
    display: flex;
    gap: 14px;
    padding: 10px 20px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-dim);
    align-items: center;
    flex-wrap: wrap;
  }
  .legend .swatch {
    width: 12px;
    height: 12px;
    display: inline-block;
    border-radius: 2px;
    margin-right: 5px;
    vertical-align: middle;
  }
  .arrow { font-size: 9px; opacity: 0.6; margin-left: 4px; }
  .stat-row { display: flex; gap: 14px; flex-wrap: wrap; padding: 0 20px 14px; }
  .stat {
    background: var(--bg-panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 12px 18px; min-width: 110px;
  }
  .stat .v { font-size: 22px; font-weight: 600; color: var(--accent); }
  .stat .k { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
</style>
</head>
<body>

<header>
  <h1 id="title">Consistency Matrix</h1>
  <span class="sub" id="subtitle"></span>
  <div class="controls">
    <input type="text" id="filterInput" placeholder="filter modules or dimensions…">
    <select id="sortMode">
      <option value="worst-module">sort: worst module first</option>
      <option value="worst-dimension">sort: worst dimension first</option>
      <option value="alpha">sort: alphabetical</option>
    </select>
  </div>
</header>

<div class="stat-row" id="statRow"></div>

<div class="layout">
  <div class="matrix-wrap">
    <table class="matrix" id="matrixTable"></table>
  </div>
  <div class="sidebar" id="sidebar">
    <div class="placeholder">Click a cell to see its detail — module, dimension, variant in use, and site count. Once /consistency-canonize has run, cell color shows distance from the chosen canon; before that, color shows variant-cluster identity.</div>
  </div>
</div>

<div class="legend" id="legend"></div>
<div id="err" class="panel" style="position:absolute;inset:0;display:none;place-items:center;z-index:9;"><p></p></div>

<script>
// The build script in /consistency-map replaces everything from the comment
// marker onward on this line with the real JSON literal — so after
// injection this becomes `const MATRIX_DATA_RAW = /*__MATRIX_DATA__*/ {...};`.
const MATRIX_DATA_RAW = /*__MATRIX_DATA__*/ null;

if (!MATRIX_DATA_RAW || !MATRIX_DATA_RAW.modules) {
  const err = document.getElementById('err');
  err.querySelector('p').innerHTML =
    'No matrix data found in this file.<br>Re-run <code>/consistency-map</code> to regenerate it.';
  err.style.display = 'grid';
  document.querySelector('.layout').style.display = 'none';
  document.querySelector('.legend').style.display = 'none';
  throw new Error('no data');
}
const MATRIX = MATRIX_DATA_RAW;

document.getElementById('title').textContent = 'Consistency Matrix — ' + (MATRIX.area || '');
document.getElementById('subtitle').textContent =
  MATRIX.modules.length + ' modules × ' + MATRIX.dimensions.length + ' dimensions';

// ---- palette per variant (stable hash → hue) --------------------------------
const VARIANT_COLORS = {};
const PALETTE = ['#5b7fa6', '#7a9e6b', '#c98f4a', '#a5648a', '#5a9e9e', '#9e7a5a', '#7a7a9e', '#9e5a5a'];
function colorForVariant(label) {
  if (VARIANT_COLORS[label]) return VARIANT_COLORS[label];
  let h = 0;
  for (let i = 0; i < label.length; i++) h = (h * 31 + label.charCodeAt(i)) >>> 0;
  const c = PALETTE[h % PALETTE.length];
  VARIANT_COLORS[label] = c;
  return c;
}
function colorForConformance(c) {
  if (c >= 0.85) return getCss('--conform-high');
  if (c >= 0.4) return getCss('--conform-mid');
  return getCss('--conform-low');
}
function getCss(varName) {
  return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
}

// ---- index cells for O(1) lookup --------------------------------------------
const cellIndex = new Map();
for (const c of (MATRIX.cells || [])) {
  cellIndex.set(c.module + '\u0000' + c.dimension, c);
}

const hasConformance = (MATRIX.cells || []).some(c => typeof c.conformance === 'number');

function renderStatRow() {
  const row = document.getElementById('statRow');
  const cells = MATRIX.cells || [];
  const totalSites = cells.reduce((s, c) => s + (c.sites || 0), 0);
  const stats = [
    ['Modules', MATRIX.modules.length],
    ['Dimensions', MATRIX.dimensions.length],
    ['Divergent cells', cells.length],
    ['Total sites', totalSites],
  ];
  if (hasConformance) {
    const withConf = cells.filter(c => typeof c.conformance === 'number');
    const avg = withConf.length ? withConf.reduce((s, c) => s + c.conformance, 0) / withConf.length : 0;
    stats.push(['Avg. conformance', Math.round(avg * 100) + '%']);
  }
  for (const [k, v] of stats) {
    const stat = document.createElement('div');
    stat.className = 'stat';
    stat.innerHTML = '<div class="v">' + v + '</div><div class="k">' + k + '</div>';
    row.appendChild(stat);
  }
}
renderStatRow();

// ---- sorting -----------------------------------------------------------------
function moduleDivergenceScore(mod) {
  let score = 0;
  for (const dim of MATRIX.dimensions) {
    const c = cellIndex.get(mod + '\u0000' + dim);
    if (!c) continue;
    score += hasConformance ? (1 - (c.conformance ?? 0.5)) : 1;
  }
  return score;
}
function dimensionDivergenceScore(dim) {
  let score = 0;
  for (const mod of MATRIX.modules) {
    const c = cellIndex.get(mod + '\u0000' + dim);
    if (!c) continue;
    score += hasConformance ? (1 - (c.conformance ?? 0.5)) : 1;
  }
  return score;
}

let sortMode = 'worst-module';
let filterText = '';

function computeOrder() {
  let modules = [...MATRIX.modules];
  let dimensions = [...MATRIX.dimensions];
  if (filterText) {
    const f = filterText.toLowerCase();
    modules = modules.filter(m => m.toLowerCase().includes(f)) ;
    dimensions = dimensions.filter(d => d.toLowerCase().includes(f));
    // if filter matches only dimensions or only modules, keep the other axis full
    if (modules.length === 0) modules = [...MATRIX.modules];
    if (dimensions.length === 0) dimensions = [...MATRIX.dimensions];
  }
  if (sortMode === 'worst-module') {
    modules.sort((a, b) => moduleDivergenceScore(b) - moduleDivergenceScore(a));
  } else if (sortMode === 'worst-dimension') {
    dimensions.sort((a, b) => dimensionDivergenceScore(b) - dimensionDivergenceScore(a));
  } else {
    modules.sort();
    dimensions.sort();
  }
  return { modules, dimensions };
}

// ---- render -------------------------------------------------------------------
function render() {
  const { modules, dimensions } = computeOrder();
  const table = document.getElementById('matrixTable');
  table.innerHTML = '';

  const thead = document.createElement('tr');
  const corner = document.createElement('th');
  corner.textContent = MATRIX.area || 'module \\ dimension';
  corner.className = 'row-head';
  thead.appendChild(corner);
  for (const dim of dimensions) {
    const th = document.createElement('th');
    th.textContent = dim;
    th.title = 'click to sort by this dimension';
    th.onclick = () => { sortMode = 'worst-dimension'; document.getElementById('sortMode').value = 'worst-dimension'; render(); };
    thead.appendChild(th);
  }
  table.appendChild(thead);

  for (const mod of modules) {
    const tr = document.createElement('tr');
    const rowLabel = document.createElement('td');
    rowLabel.textContent = mod;
    rowLabel.className = 'row-label';
    rowLabel.onclick = () => { sortMode = 'worst-module'; document.getElementById('sortMode').value = 'worst-module'; render(); };
    tr.appendChild(rowLabel);

    for (const dim of dimensions) {
      const td = document.createElement('td');
      td.className = 'cell';
      const c = cellIndex.get(mod + '\u0000' + dim);
      if (!c) {
        td.classList.add('empty');
        td.title = 'no data for ' + mod + ' × ' + dim;
      } else {
        const bg = hasConformance && typeof c.conformance === 'number'
          ? colorForConformance(c.conformance)
          : colorForVariant(c.variant || '?');
        const div = document.createElement('div');
        div.className = 'fill';
        div.style.background = bg;
        div.textContent = c.sites != null ? c.sites : '';
        td.appendChild(div);
        td.onclick = () => selectCell(td, mod, dim, c);
      }
      tr.appendChild(td);
    }
    table.appendChild(tr);
  }

  renderLegend();
}

let selectedTd = null;
function selectCell(td, mod, dim, cell) {
  if (selectedTd) selectedTd.classList.remove('selected');
  td.classList.add('selected');
  selectedTd = td;

  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '';
  const h = document.createElement('h2');
  h.textContent = dim;
  sidebar.appendChild(h);

  const rows = [
    ['Module', mod],
    ['Variant', cell.variant || '(unknown)'],
    ['Sites', cell.sites != null ? String(cell.sites) : '?'],
  ];
  if (typeof cell.conformance === 'number') {
    rows.push(['Conformance to canon', Math.round(cell.conformance * 100) + '%']);
  }
  for (const [k, v] of rows) {
    const row = document.createElement('div');
    row.className = 'meta-row';
    row.innerHTML = '<span class="k">' + k + '</span><span>' + escapeHtml(String(v)) + '</span>';
    sidebar.appendChild(row);
  }

  if (cell.example) {
    const ex = document.createElement('div');
    ex.className = 'example';
    ex.textContent = cell.example;
    sidebar.appendChild(ex);
  }
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderLegend() {
  const legend = document.getElementById('legend');
  legend.innerHTML = '';
  if (hasConformance) {
    const items = [
      ['--conform-high', 'aligned with canon (≥85%)'],
      ['--conform-mid', 'partially aligned (40–85%)'],
      ['--conform-low', 'diverges from canon (<40%)'],
    ];
    for (const [varName, label] of items) {
      const span = document.createElement('span');
      const sw = document.createElement('span');
      sw.className = 'swatch';
      sw.style.background = getCss(varName);
      span.appendChild(sw);
      span.appendChild(document.createTextNode(label));
      legend.appendChild(span);
    }
  } else {
    const note = document.createElement('span');
    note.textContent = 'Colors show variant identity — run /consistency-canonize to switch this to a conformance-to-canon scale.';
    legend.appendChild(note);
  }
}

document.getElementById('filterInput').addEventListener('input', e => {
  filterText = e.target.value;
  render();
});
document.getElementById('sortMode').addEventListener('change', e => {
  sortMode = e.target.value;
  render();
});

render();
</script>
</body>
</html>
