<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confab Burndown</title>
<style>
/*__TOKENS__*/
</style>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: var(--font-size-base);
  }
  header { padding: var(--space-4) var(--space-5); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; margin: 0 0 4px; font-weight: 600; color: var(--accent); }
  header .sub { color: var(--muted); font-size: 12px; }
  .tabs { display: flex; gap: var(--space-2); margin-top: var(--space-3); }
  .tab-btn {
    background: var(--panel); color: var(--muted); border: 1px solid var(--border);
    border-radius: var(--radius-control); padding: 6px 14px; font: inherit; font-size: 12px;
    cursor: pointer; transition: var(--transition-fast);
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--accent); border-color: var(--accent); background: var(--panel-2); }
  .stat-row { padding: var(--space-4) var(--space-5) 0; display: flex; gap: 14px; flex-wrap: wrap; }
  .stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius-control);
    padding: 12px 18px;
    min-width: 110px;
  }
  .stat .v { font-size: 22px; font-weight: 600; color: var(--accent); }
  .stat .k { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .content {
    padding: var(--space-5);
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: var(--space-5);
    max-width: 1400px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius-panel);
    padding: var(--space-4);
  }
  .panel.wide { grid-column: 1 / -1; }
  .panel h2 {
    font-size: 13px;
    margin: 0 0 var(--space-3);
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .legend { display: flex; gap: 16px; font-size: 11px; color: var(--muted); margin-top: 10px; flex-wrap: wrap; }
  .legend .swatch { width: 10px; height: 10px; display: inline-block; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 12px; cursor: pointer; }
  .bar-row:hover .label { color: var(--accent); }
  .bar-row .label { width: 100px; flex-shrink: 0; color: var(--muted); }
  .bar-row .track { flex: 1; background: var(--panel-2); border-radius: var(--radius-sm); height: 16px; overflow: hidden; }
  .bar-row .fill { height: 100%; border-radius: var(--radius-sm); }
  .bar-row .count { width: 28px; text-align: right; flex-shrink: 0; }
  #chart { width: 100%; height: 260px; }
  .layout { display: flex; }
  .sidebar {
    width: 340px; border-left: 1px solid var(--border); background: var(--panel);
    padding: var(--space-4); overflow-y: auto; flex-shrink: 0;
    position: sticky; top: var(--space-3); max-height: calc(100vh - 2 * var(--space-3));
  }
  .sidebar h2 { font-size: 14px; margin: 0 0 10px; color: var(--accent); }
  .sidebar .placeholder { color: var(--muted); font-size: 13px; line-height: var(--line-height-base); margin-top: 40px; }
  .sidebar .finding-item { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
  .sidebar .finding-item .id { font-weight: 500; }
  .sidebar .finding-item .meta { color: var(--muted); margin-top: 2px; }
  .sidebar .finding-item .evidence {
    margin-top: 4px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 5px 7px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px;
    word-break: break-word;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header>
  <h1 id="title">Confab Burndown</h1>
  <span class="sub" id="subtitle"></span>
</header>

<div class="layout">
  <div class="content" id="content"></div>
  <div class="sidebar" id="sidebar">
    <div class="placeholder">Click a "by status" or "by domain" bar to see the actual findings behind that count.</div>
  </div>
</div>
<div id="err" class="panel" style="position:absolute;inset:0;display:none;place-items:center;z-index:9;"><p></p></div>

<script>
// build_burndown_html.py replaces everything from the marker onward on this
// line with the real JSON literal.
const BURNDOWN_DATA_RAW = /*__BURNDOWN_DATA__*/ null;

if (!BURNDOWN_DATA_RAW || !BURNDOWN_DATA_RAW.passes) {
  const err = document.getElementById('err');
  err.querySelector('p').innerHTML =
    'No burndown data found in this file.<br>Re-run <code>confab-status</code> (with a confab-cycle ledger present) to regenerate it.';
  err.style.display = 'grid';
  document.getElementById('content').style.display = 'none';
  throw new Error('no data');
}
const DATA = BURNDOWN_DATA_RAW;

document.getElementById('title').textContent = 'Confab Burndown';
document.getElementById('subtitle').textContent =
  DATA.totalPasses + ' passes · ' + DATA.totalFindingsEver + ' findings tracked';

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function escapeHtml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function showFindingsInSidebar(title, findings) {
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '';
  sidebar.appendChild(el('h2', null, title + ' (' + findings.length + ')'));
  if (!findings.length) {
    sidebar.appendChild(el('div', 'placeholder', 'No findings in this bucket.'));
    return;
  }
  for (const f of findings) {
    const item = el('div', 'finding-item');
    item.appendChild(el('div', 'id', escapeHtml(f.id) + (f.severity ? ' · ' + f.severity : '')));
    item.appendChild(el('div', 'meta',
      'domain: ' + escapeHtml(f.domain) + ' · category: ' + escapeHtml(f.category || '?') +
      (f.reopenCount ? ' · reopened ' + f.reopenCount + 'x' : '')));
    if (f.evidence) item.appendChild(el('div', 'evidence', escapeHtml(f.evidence)));
    sidebar.appendChild(item);
  }
}

function renderBarPanel(title, parent, counts, colorMap, findingField) {
  const panel = el('div', 'panel');
  panel.appendChild(el('h2', null, title));
  const keys = Object.keys(counts);
  const max = Math.max(1, ...keys.map(k => counts[k] || 0));
  const allFindings = DATA.findings || [];
  for (const k of keys) {
    const n = counts[k] || 0;
    const row = el('div', 'bar-row');
    row.appendChild(el('div', 'label', escapeHtml(k)));
    const track = el('div', 'track');
    const fill = el('div', 'fill');
    fill.style.width = (n / max * 100) + '%';
    fill.style.background = (colorMap && colorMap[k]) || 'var(--accent)';
    track.appendChild(fill);
    row.appendChild(track);
    row.appendChild(el('div', 'count', String(n)));
    row.onclick = () => showFindingsInSidebar(title + ': ' + k, allFindings.filter(f => f[findingField] === k));
    panel.appendChild(row);
  }
  parent.appendChild(panel);
}

function renderChart(parent) {
  const panel = el('div', 'panel wide');
  panel.appendChild(el('h2', null, 'Closed / drafted findings per pass, cumulative closed'));

  const passes = DATA.passes;
  const W = 900, H = 260, padL = 40, padR = 20, padT = 10, padB = 30;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const n = Math.max(1, passes.length);
  const barGroupW = plotW / n;
  const maxBar = Math.max(1, ...passes.map(p => Math.max(p.closed, p.fixOrDraftOutcomes)));
  const maxCum = Math.max(1, ...passes.map(p => p.cumulativeClosed));

  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.setAttribute('id', 'chart');

  // axis line
  const axis = document.createElementNS(svgNS, 'line');
  axis.setAttribute('x1', padL); axis.setAttribute('y1', padT + plotH);
  axis.setAttribute('x2', padL + plotW); axis.setAttribute('y2', padT + plotH);
  axis.setAttribute('stroke', 'var(--border)');
  svg.appendChild(axis);

  passes.forEach((p, i) => {
    const gx = padL + i * barGroupW;
    const barW = barGroupW * 0.28;
    // closed bar
    const closedH = (p.closed / maxBar) * plotH;
    const closedRect = document.createElementNS(svgNS, 'rect');
    closedRect.setAttribute('x', gx + barGroupW * 0.15);
    closedRect.setAttribute('y', padT + plotH - closedH);
    closedRect.setAttribute('width', barW);
    closedRect.setAttribute('height', closedH);
    closedRect.setAttribute('fill', 'var(--closed)');
    svg.appendChild(closedRect);
    // outcomes bar
    const outH = (p.fixOrDraftOutcomes / maxBar) * plotH;
    const outRect = document.createElementNS(svgNS, 'rect');
    outRect.setAttribute('x', gx + barGroupW * 0.15 + barW + 4);
    outRect.setAttribute('y', padT + plotH - outH);
    outRect.setAttribute('width', barW);
    outRect.setAttribute('height', outH);
    outRect.setAttribute('fill', 'var(--outcomes)');
    svg.appendChild(outRect);
    // x label
    const label = document.createElementNS(svgNS, 'text');
    label.setAttribute('x', gx + barGroupW / 2);
    label.setAttribute('y', H - 8);
    label.setAttribute('fill', 'var(--text-dim)');
    label.setAttribute('font-size', '10');
    label.setAttribute('text-anchor', 'middle');
    label.textContent = '#' + p.passNumber;
    svg.appendChild(label);
  });

  // cumulative line
  const points = passes.map((p, i) => {
    const x = padL + i * barGroupW + barGroupW / 2;
    const y = padT + plotH - (p.cumulativeClosed / maxCum) * plotH;
    return x + ',' + y;
  }).join(' ');
  const polyline = document.createElementNS(svgNS, 'polyline');
  polyline.setAttribute('points', points);
  polyline.setAttribute('fill', 'none');
  polyline.setAttribute('stroke', 'var(--cumulative)');
  polyline.setAttribute('stroke-width', '2');
  svg.appendChild(polyline);
  passes.forEach((p, i) => {
    const x = padL + i * barGroupW + barGroupW / 2;
    const y = padT + plotH - (p.cumulativeClosed / maxCum) * plotH;
    const dot = document.createElementNS(svgNS, 'circle');
    dot.setAttribute('cx', x); dot.setAttribute('cy', y); dot.setAttribute('r', 3);
    dot.setAttribute('fill', 'var(--cumulative)');
    const title = document.createElementNS(svgNS, 'title');
    title.textContent = 'pass ' + p.passNumber + ' (' + p.domain + '): cumulative closed ' + p.cumulativeClosed;
    dot.appendChild(title);
    svg.appendChild(dot);
  });

  panel.appendChild(svg);
  const legend = el('div', 'legend');
  legend.innerHTML =
    '<span><span class="swatch" style="background:var(--closed)"></span>closed this pass</span>' +
    '<span><span class="swatch" style="background:var(--outcomes)"></span>fix/draft outcomes this pass</span>' +
    '<span><span class="swatch" style="background:var(--cumulative)"></span>cumulative closed</span>';
  panel.appendChild(legend);
  parent.appendChild(panel);
}

function render() {
  const content = document.getElementById('content');
  content.innerHTML = '';

  const statRow = el('div', 'stat-row');
  const stats = [
    ['Total passes', DATA.totalPasses],
    ['Findings tracked', DATA.totalFindingsEver],
    ['Open', DATA.byStatus.open || 0],
    ['Closed', DATA.byStatus.closed || 0],
    ['Escalated', DATA.byStatus.escalated || 0],
  ];
  for (const [k, v] of stats) {
    const stat = el('div', 'stat');
    stat.appendChild(el('div', 'v', escapeHtml(v)));
    stat.appendChild(el('div', 'k', k));
    statRow.appendChild(stat);
  }
  content.appendChild(statRow);

  renderChart(content);
  renderBarPanel('Findings by status', content, DATA.byStatus,
    { open: 'var(--open)', closed: 'var(--closed)', escalated: 'var(--escalated)' }, 'status');
  renderBarPanel('Findings by domain', content, DATA.byDomain, null, 'domain');
}

render();
</script>
</body>
</html>
