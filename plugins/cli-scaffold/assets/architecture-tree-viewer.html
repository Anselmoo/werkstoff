<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Scaffold Architecture</title>
<style>
/*__TOKENS__*/
:root {
  /* Role colors are specific to this viewer's five-pillar legend; no
     equivalent exists in the shared token file, so they stay local.
     role-core (#4c8d5a) and role-test (#b58b3a) numerically match
     --status-good/--status-warn -- coincidence, not a shared concept, so
     they are NOT aliased to those tokens (see Global Constraints).
     tokens.css now also ships a --cat-1..5 categorical scale that partially
     overlaps this six-hue --role-* set by hue family (independent
     convergence on similar hues is real evidence they should eventually be
     unified) -- not migrated in this change, comment only. */
  --role-core: #4c8d5a; --role-entry: #5b7fa6; --role-distribution: #a5648a;
  --role-test: #b58b3a; --role-help: #5a9e9e; --role-completion: #9e7a5a;
  --role-other: #444;
}
* { box-sizing: border-box; margin: 0; }
html, body { background: var(--bg); color: var(--text);
  font: var(--font-size-base)/var(--line-height-base) var(--font-sans); }
body { max-width: 900px; margin: 0 auto; padding: var(--space-5); }
.panel { background: var(--panel); border: 1px solid var(--border);
  border-radius: var(--radius-panel); padding: var(--space-2) var(--space-3); }
#title-panel { margin-bottom: var(--space-4); }
#title-panel h1 { font-size: 15px; color: var(--accent); margin-bottom: 2px; }
#title-panel .sub { color: var(--muted); font-size: 12px; }
#tree-wrap { position: relative; }
#guides { position: absolute; top: 0; left: 0; pointer-events: none; }
#tree { position: relative; }
.tree-row { position: absolute; display: flex; align-items: center; gap: var(--space-2);
  height: 22px; white-space: nowrap; }
.row-name { font-size: 13px; }
.row-count { color: var(--muted); font-size: 11px; }
.row-badges { display: flex; gap: 4px; flex-wrap: wrap; }
.badge { display: inline-block; padding: 1px 6px; border-radius: var(--radius-sm);
  font-size: 10px; color: #fff; line-height: 1.5; cursor: default; }
#legend { display: flex; gap: var(--space-3); font-size: 11px; color: var(--muted);
  flex-wrap: wrap; margin-top: var(--space-5); border-top: 1px solid var(--border);
  padding-top: var(--space-3); }
#legend .swatch { width: 10px; height: 10px; display: inline-block; border-radius: 50%;
  margin-right: 5px; vertical-align: middle; }
</style>
</head>
<body>
<main>
  <header class="panel" id="title-panel">
    <h1 id="title">Scaffold Architecture</h1>
    <div class="sub" id="subtitle"></div>
  </header>

  <div id="tree-wrap">
    <svg id="guides"></svg>
    <div id="tree"></div>
  </div>

  <div id="legend"></div>
</main>
<div id="err" class="panel" style="position:fixed;inset:0;display:none;place-items:center;z-index:9;"><p></p></div>

<!--__D3_SUBSET__-->
<script type="module">
const d3 = window.d3;

// Injected by build_architecture_tree.py.
const DATA = /*__TREE_DATA__*/ null;

if (!DATA || !DATA.tree) {
  const err = document.getElementById("err");
  err.querySelector("p").innerHTML =
    "No architecture data found in this file.<br>Re-run the cli-scaffold paradigm skill to regenerate it.";
  err.style.display = "grid";
  throw new Error("no data");
}

document.getElementById("title").textContent = "Scaffold Architecture — " + (DATA.appName || "");
document.getElementById("subtitle").textContent = "language: " + (DATA.language || "?");

// ── Layout: indented tree (directories genuinely nest, but at 5-15 files
// and 1-3 levels a circle-pack buries the one thing that matters -- role
// badges -- behind a click; a plain indented list shows it inline). ─────
function countLeaves(n) {
  if (n.type === "file") return 1;
  return (n.children || []).reduce((s, c) => s + countLeaves(c), 0);
}

const root = d3.hierarchy(DATA.tree, d => d.children);

function fullPath(d) {
  const parts = [];
  let cur = d;
  while (cur) { parts.unshift(cur.data.name); cur = cur.parent; }
  return parts.join("/");
}

// Row 0 is DATA.tree's own top-level children -- the scaffold root itself
// is already named in the title panel above, so it is not its own row.
const ROW_H = 22, INDENT = 20, LEFT_PAD = 10;
const rows = [];
root.eachBefore(d => { if (d.depth > 0) rows.push(d); });
rows.forEach((d, i) => { d.rowIndex = i; });

function rowMidY(d) { return d.rowIndex * ROW_H + ROW_H / 2; }
function colX(depth) { return LEFT_PAD + depth * INDENT; }

// One vertical rail per directory (parent row down to its last child row)
// plus one horizontal tick per child, computed from d3.hierarchy()'s own
// parent/children links -- real SVG lines, not CSS border tricks, so they
// stay crisp. (d3.max is NOT used here -- d3-array is not in the vendored
// bundle -- maxDepth below is a plain reduce.)
const guideLines = [];
for (const d of rows) {
  if (!d.children || !d.children.length) continue;
  const railX = colX(d.depth);
  guideLines.push({
    type: "v", x: railX, y1: rowMidY(d), y2: rowMidY(d.children[d.children.length - 1]),
  });
  for (const c of d.children) {
    guideLines.push({ type: "h", y: rowMidY(c), x1: railX, x2: colX(c.depth) });
  }
}

const maxDepth = rows.reduce((m, d) => Math.max(m, d.depth), 1);
const svgWidth = colX(maxDepth) + 40;
const svgHeight = rows.length * ROW_H;

const guides = document.getElementById("guides");
guides.setAttribute("width", svgWidth);
guides.setAttribute("height", svgHeight);
guides.setAttribute("viewBox", `0 0 ${svgWidth} ${svgHeight}`);

d3.select(guides).selectAll("line.guide")
  .data(guideLines)
  .join("line")
  .attr("class", "guide")
  .attr("x1", d => d.type === "v" ? d.x : d.x1)
  .attr("y1", d => d.type === "v" ? d.y1 : d.y)
  .attr("x2", d => d.type === "v" ? d.x : d.x2)
  .attr("y2", d => d.type === "v" ? d.y2 : d.y)
  .attr("stroke", "var(--border)")
  .attr("stroke-width", 1);

const treeEl = document.getElementById("tree");
treeEl.style.height = svgHeight + "px";

const rowSel = d3.select(treeEl).selectAll(".tree-row")
  .data(rows, d => fullPath(d))
  .join("div")
  .attr("class", "tree-row")
  .style("top", d => (d.rowIndex * ROW_H) + "px")
  .style("left", d => colX(d.depth) + "px")
  .attr("title", d => fullPath(d));

rowSel.each(function (d) {
  const row = d3.select(this);
  row.append("span")
    .attr("class", "row-name")
    .text(d.data.name + (d.data.type === "dir" ? "/" : ""));

  if (d.data.type === "dir") {
    row.append("span")
      .attr("class", "row-count")
      .text("(" + countLeaves(d.data) + ")");
  } else if ((d.data.roles || []).length) {
    const badges = row.append("span").attr("class", "row-badges");
    for (const r of d.data.roles) {
      badges.append("span")
        .attr("class", "badge")
        .style("background", "var(--role-" + r + ")")
        .attr("title", DATA.roleLabels[r] || r)
        .text(r);
    }
  }
});

// ── Legend ──────────────────────────────────────────────────────────────
(function renderLegend() {
  const legend = document.getElementById("legend");
  for (const [role, label] of Object.entries(DATA.roleLabels)) {
    const span = document.createElement("span");
    const sw = document.createElement("span");
    sw.className = "swatch";
    sw.style.background = "var(--role-" + role + ")";
    span.appendChild(sw);
    span.appendChild(document.createTextNode(label));
    legend.appendChild(span);
  }
})();
</script>
</body>
</html>
