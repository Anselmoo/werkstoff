<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Scaffold Architecture</title>
<style>
  :root {
    --bg: #1e1e1e; --panel: #252526; --panel-2: #2d2d2d;
    --text: #d4d4d4; --muted: #8a8a8a; --accent: #cc785c; --border: #3a3a3a;
    --role-core: #4c8d5a; --role-entry: #5b7fa6; --role-distribution: #a5648a;
    --role-test: #b58b3a; --role-help: #5a9e9e; --role-completion: #9e7a5a;
    --role-other: #444;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg);
    color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
  #map { position: absolute; inset: 0; cursor: grab; }
  #map.dragging { cursor: grabbing; }
  #hud { position: absolute; top: 12px; left: 12px; width: 280px;
    display: flex; flex-direction: column; gap: 8px; z-index: 2; }
  .panel { background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; }
  .panel h1 { font-size: 15px; color: var(--accent); margin-bottom: 2px; }
  .panel .sub { color: var(--muted); font-size: 12px; }
  #search { width: 100%; padding: 6px 8px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--panel-2);
    color: var(--text); font: inherit; outline: none; }
  #search:focus { border-color: var(--accent); }
  #sidebar { position: absolute; top: 12px; right: 12px; bottom: 12px;
    width: 320px; overflow-y: auto; z-index: 2; display: none; }
  #sidebar.open { display: block; }
  #sidebar h2 { font-size: 16px; word-break: break-word; }
  #sidebar .meta { color: var(--muted); font-size: 12px; margin: 2px 0 10px; }
  #sidebar .role-line { padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
  #sidebar .closebtn { float: right; cursor: pointer; color: var(--muted);
    font-size: 18px; line-height: 1; } #sidebar .closebtn:hover { color: var(--text); }
  #legend { position: absolute; bottom: 10px; left: 12px; display: flex; gap: 12px;
    font-size: 11px; color: var(--muted); z-index: 2; flex-wrap: wrap; max-width: 70%; }
  #legend .swatch { width: 10px; height: 10px; display: inline-block; border-radius: 50%;
    margin-right: 5px; vertical-align: middle; }
  #hint { position: absolute; bottom: 10px; right: 12px;
    color: var(--muted); font-size: 12px; z-index: 2; }
</style>
</head>
<body>
<svg id="map"></svg>

<div id="hud">
  <div class="panel">
    <h1 id="title">Scaffold Architecture</h1>
    <div class="sub" id="subtitle"></div>
  </div>
  <div class="panel">
    <input id="search" type="search" placeholder="Filter files…" autocomplete="off">
  </div>
</div>

<div id="sidebar" class="panel"></div>
<div id="legend"></div>
<div id="hint">drag to pan · scroll to zoom · click a circle for detail</div>

<!--__D3_SUBSET__-->
<script type="module">
const d3 = window.d3;

// Injected by build_architecture_tree.py.
const DATA = /*__TREE_DATA__*/ null;

document.getElementById("title").textContent = "Scaffold Architecture — " + (DATA.appName || "");
document.getElementById("subtitle").textContent = "language: " + (DATA.language || "?");

// ── Layout: real nested circle-pack (directories genuinely nest) ──────────
function countLeaves(n) {
  if (n.type === "file") return 1;
  return (n.children || []).reduce((s, c) => s + countLeaves(c), 0);
}
const WORLD = 900;
const root = d3.hierarchy(DATA.tree, d => d.children)
  .sum(d => (d.type === "file" ? 1 : 0))
  .sort((a, b) => b.value - a.value);
d3.pack().size([WORLD, WORLD]).padding(d => Math.max(2, 14 / (d.depth + 1)))(root);

function colorFor(d) {
  if (d.data.type === "dir") return d.depth % 2 ? "#2d2d2d" : "#262626";
  const roles = d.data.roles || [];
  return roles.length ? "var(--role-" + roles[0] + ")" : "var(--role-other)";
}

const svg = d3.select("#map");
const g = svg.append("g");

function fullPath(d) {
  const parts = [];
  let cur = d;
  while (cur) { parts.unshift(cur.data.name); cur = cur.parent; }
  return parts.join("/");
}

const nodeSel = g.selectAll("g.node")
  .data(root.descendants())
  .join("g")
  .attr("class", "node")
  .attr("transform", d => `translate(${d.x},${d.y})`)
  .style("cursor", "pointer");

nodeSel.append("circle")
  .attr("r", d => d.r)
  .attr("fill", d => colorFor(d))
  .attr("fill-opacity", d => (d.data.type === "dir" ? 0.55 : 0.9))
  .attr("stroke", "#3a3a3a")
  .attr("stroke-width", 1);

nodeSel.filter(d => d.r > 14).append("text")
  .attr("text-anchor", "middle")
  .attr("dy", d => (d.data.type === "dir" && d.r > 40 ? -d.r + 14 : 4))
  .attr("font-size", d => Math.min(13, Math.max(8, d.r / 4)))
  .attr("fill", d => (d.data.type === "dir" ? "#8a8a8a" : "#e8e8e8"))
  .text(d => {
    const name = d.data.name;
    return name.length > 16 ? name.slice(0, 14) + "…" : name;
  });

nodeSel.append("title").text(d => fullPath(d));

nodeSel.on("click", (event, d) => {
  event.stopPropagation();
  selectNode(d);
});

const zoomB = d3.zoom().scaleExtent([0.5, 12])
  .on("zoom", ev => g.attr("transform", ev.transform))
  .on("start", () => svg.classed("dragging", true))
  .on("end", () => svg.classed("dragging", false));
svg.call(zoomB);

function resize() {
  svg.attr("viewBox", `0 0 ${innerWidth} ${innerHeight}`);
}
resize();
addEventListener("resize", resize);

// Initial fit: center + scale the whole pack in frame.
(function initialFit() {
  const k = Math.min(innerWidth, innerHeight) / (WORLD * 1.15);
  const tx = innerWidth / 2 - (WORLD / 2) * k;
  const ty = innerHeight / 2 - (WORLD / 2) * k;
  svg.call(zoomB.transform, d3.zoomIdentity.translate(tx, ty).scale(k));
})();

// ── Sidebar ─────────────────────────────────────────────────────────────
const sidebar = document.getElementById("sidebar");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function selectNode(d) {
  sidebar.innerHTML = "";
  const close = document.createElement("span");
  close.className = "closebtn"; close.textContent = "×";
  close.onclick = () => sidebar.classList.remove("open");
  sidebar.appendChild(close);
  sidebar.appendChild(Object.assign(document.createElement("h2"), { textContent: d.data.name }));
  sidebar.appendChild(Object.assign(document.createElement("div"), {
    className: "meta", textContent: fullPath(d).replace(/^[^/]*\//, ""),
  }));

  if (d.data.type === "dir") {
    const count = countLeaves(d.data);
    sidebar.appendChild(Object.assign(document.createElement("div"), {
      className: "role-line", textContent: count + " file(s) inside",
    }));
  } else {
    const roles = d.data.roles || [];
    if (!roles.length) {
      sidebar.appendChild(Object.assign(document.createElement("div"), {
        className: "role-line",
        textContent: "Not one of the manifest's declared gating files — uncategorized, not a problem.",
      }));
    } else {
      for (const r of roles) {
        const line = document.createElement("div");
        line.className = "role-line";
        line.innerHTML = '<span class="swatch" style="background:var(--role-' + r + ');display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;"></span>' +
          esc(DATA.roleLabels[r] || r);
        sidebar.appendChild(line);
      }
    }
  }
  sidebar.classList.add("open");
}

svg.on("click", () => sidebar.classList.remove("open"));

// ── Search / filter ───────────────────────────────────────────────────────
document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  nodeSel.select("circle").attr("stroke", d => {
    if (!q) return "#3a3a3a";
    return d.data.name.toLowerCase().includes(q) ? "#cc785c" : "#3a3a3a";
  }).attr("stroke-width", d => (q && d.data.name.toLowerCase().includes(q) ? 2.5 : 1));
});

// ── Legend ──────────────────────────────────────────────────────────────
(function renderLegend() {
  const legend = document.getElementById("legend");
  for (const [role, label] of Object.entries(DATA.roleLabels)) {
    const span = document.createElement("span");
    const sw = document.createElement("span");
    sw.className = "swatch";
    sw.style.background = "var(--role-" + role + ")";
    span.appendChild(sw);
    span.appendChild(document.createTextNode(label));
    legend.appendChild(span);
  }
})();
</script>
</body>
</html>
