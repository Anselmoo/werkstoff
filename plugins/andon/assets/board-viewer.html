<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andon Board</title>
<style>
  :root {
    --bg: #1e1e1e;
    --bg-panel: #252526;
    --bg-header: #2d2d2d;
    --text: #d4d4d4;
    --text-dim: #8a8a8a;
    --accent: #cc785c;
    --border: #3a3a3a;
    --wire-green: #4c8d5a;
    --wire-red: #b0503f;
    --wire-unknown: #3a5a7a;
    --hold-bg: #4a2020;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 14px;
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 16px;
    margin: 0 0 4px;
    font-weight: 600;
    color: var(--accent);
  }
  header .sub { color: var(--text-dim); font-size: 12px; }
  .content {
    padding: 20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 20px;
    max-width: 1400px;
  }
  .panel {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
  }
  .panel h2 {
    font-size: 13px;
    margin: 0 0 12px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .hold-banner {
    grid-column: 1 / -1;
    background: var(--hold-bg);
    border: 1px solid var(--wire-red);
    border-radius: 6px;
    padding: 14px 16px;
  }
  .hold-banner h2 { color: #ff8a75; margin-bottom: 8px; }
  .hold-banner ul { margin: 0; padding-left: 20px; }
  .stat-row {
    grid-column: 1 / -1;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }
  .stat {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 18px;
    min-width: 110px;
  }
  .stat .v { font-size: 22px; font-weight: 600; color: var(--accent); }
  .stat .k { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  table.wires { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.wires th, table.wires td {
    text-align: left;
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
  }
  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
    color: #fff;
  }
  .badge.green { background: var(--wire-green); }
  .badge.red { background: var(--wire-red); }
  .badge.unknown { background: var(--wire-unknown); }
  .constraint {
    font-size: 13px;
    line-height: 1.6;
  }
  .constraint .label { color: var(--text-dim); font-size: 11px; text-transform: uppercase; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 12px; }
  .bar-row .label { width: 90px; flex-shrink: 0; color: var(--text-dim); }
  .bar-row .track { flex: 1; background: var(--bg-header); border-radius: 3px; height: 16px; overflow: hidden; }
  .bar-row .fill { height: 100%; background: var(--accent); border-radius: 3px; }
  .bar-row .count { width: 24px; text-align: right; flex-shrink: 0; }
  .stages-list { font-size: 13px; line-height: 1.9; }
  .stages-list .cursor-marker { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>

<header>
  <h1 id="title">Andon Board</h1>
  <span class="sub" id="subtitle"></span>
</header>

<div class="content" id="content"></div>

<script>
// build_board_html.py replaces everything from the marker onward on this
// line with the real JSON literal. Left unmodified (template opened
// directly), the fallback demo below is used instead.
const BOARD_DATA_RAW = /*__BOARD_DATA__*/ null;

const BOARD = BOARD_DATA_RAW || {
  stages: ["ingest", "transform", "publish"],
  wire_rows: [
    { wire: "ingest->transform", status: "green" },
    { wire: "transform->publish", status: "red" },
  ],
  cursor: "transform::stale-schema-cache",
  counters: { total_passes: 4, current_cycle: 2, pass_in_cycle: 1, cycles_converged: 1 },
  constraint: "transform (reopened 2x)",
  open_gap_counts_by_kind: { bug: 1, feature: 0, wire: 1 },
  open_gap_counts_by_radius: { local: 1, module: 1, cross_module: 0, repo_wide: 0 },
  strategy_counts: { a: 2, b: 0, c: 1, d: 0, e: 1, f: 0, g: 0 },
  non_overridable_holds: [],
};

document.getElementById('title').textContent =
  'Andon Board' + (BOARD_DATA_RAW ? '' : ' — (no data — template opened directly)');
document.getElementById('subtitle').textContent =
  BOARD.stages.length + ' stages · cycle ' + BOARD.counters.current_cycle +
  ' · pass ' + BOARD.counters.pass_in_cycle + ' · ' + BOARD.counters.total_passes + ' total passes';

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderBarPanel(title, containerParent, counts, order) {
  const panel = el('div', 'panel');
  panel.appendChild(el('h2', null, title));
  const keys = order || Object.keys(counts);
  const max = Math.max(1, ...keys.map(k => counts[k] || 0));
  for (const k of keys) {
    const n = counts[k] || 0;
    const row = el('div', 'bar-row');
    row.appendChild(el('div', 'label', escapeHtml(k)));
    const track = el('div', 'track');
    const fill = el('div', 'fill');
    fill.style.width = (n / max * 100) + '%';
    track.appendChild(fill);
    row.appendChild(track);
    row.appendChild(el('div', 'count', String(n)));
    panel.appendChild(row);
  }
  containerParent.appendChild(panel);
}

function render() {
  const content = document.getElementById('content');
  content.innerHTML = '';

  // 1. Non-overridable holds -- lead with these, per andon-status's own render order.
  if (BOARD.non_overridable_holds && BOARD.non_overridable_holds.length) {
    const banner = el('div', 'hold-banner');
    banner.appendChild(el('h2', null, '⛔ Non-overridable holds (' + BOARD.non_overridable_holds.length + ')'));
    const ul = el('ul');
    for (const h of BOARD.non_overridable_holds) {
      ul.appendChild(el('li', null, escapeHtml(h.wire) + ' — ' + escapeHtml(h.slug)));
    }
    banner.appendChild(ul);
    content.appendChild(banner);
  }

  // 2. Counters stat row.
  const statRow = el('div', 'stat-row');
  const stats = [
    ['Cycle', BOARD.counters.current_cycle],
    ['Pass in cycle', BOARD.counters.pass_in_cycle],
    ['Total passes', BOARD.counters.total_passes],
    ['Cycles converged', BOARD.counters.cycles_converged],
  ];
  for (const [k, v] of stats) {
    const stat = el('div', 'stat');
    stat.appendChild(el('div', 'v', escapeHtml(v)));
    stat.appendChild(el('div', 'k', k));
    statRow.appendChild(stat);
  }
  content.appendChild(statRow);

  // 3. Stream table (stages) + wire statuses.
  const streamPanel = el('div', 'panel');
  streamPanel.appendChild(el('h2', null, 'Stream'));
  const stagesList = el('div', 'stages-list');
  const cursorStage = (BOARD.cursor || '').split('::')[0];
  for (const s of BOARD.stages) {
    const marked = s === cursorStage;
    stagesList.appendChild(el('div', marked ? 'cursor-marker' : null, (marked ? '→ ' : '  ') + escapeHtml(s)));
  }
  streamPanel.appendChild(stagesList);
  content.appendChild(streamPanel);

  // 4. Wire statuses table.
  const wirePanel = el('div', 'panel');
  wirePanel.appendChild(el('h2', null, 'Wires'));
  const table = el('table', 'wires');
  const thead = el('tr', null, '<th>Wire</th><th>Status</th>');
  table.appendChild(thead);
  for (const w of BOARD.wire_rows) {
    const tr = el('tr');
    tr.appendChild(el('td', null, escapeHtml(w.wire)));
    const td = el('td');
    td.appendChild(el('span', 'badge ' + w.status, w.status));
    tr.appendChild(td);
    table.appendChild(tr);
  }
  wirePanel.appendChild(table);
  content.appendChild(wirePanel);

  // 5. Cursor + constraint.
  const constraintPanel = el('div', 'panel');
  constraintPanel.appendChild(el('h2', null, 'Cursor & constraint'));
  const cWrap = el('div', 'constraint');
  cWrap.appendChild(el('div', null, '<span class="label">Cursor</span><br>' + escapeHtml(BOARD.cursor)));
  cWrap.appendChild(el('div', null, '<br><span class="label">Active constraint</span><br>' + escapeHtml(BOARD.constraint)));
  constraintPanel.appendChild(cWrap);
  content.appendChild(constraintPanel);

  // 6. Gap counts by kind / by blast-radius, and strategy mix.
  renderBarPanel('Open gaps by kind', content, BOARD.open_gap_counts_by_kind);
  renderBarPanel('Open gaps by blast radius', content, BOARD.open_gap_counts_by_radius,
    ['local', 'module', 'cross_module', 'repo_wide']);
  renderBarPanel('Evidence-strategy mix', content, BOARD.strategy_counts,
    ['a', 'b', 'c', 'd', 'e', 'f', 'g']);
}

render();
</script>
</body>
</html>
