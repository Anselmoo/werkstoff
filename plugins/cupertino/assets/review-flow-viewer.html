<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cupertino Review Flow</title>
<style>
/*__DESIGN_TOKENS__*/
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: var(--font-size-base);
    line-height: var(--line-height-base);
  }
  header { padding: var(--space-4) var(--space-5); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; margin: 0 0 var(--space-1); font-weight: 600; color: var(--accent); }
  header .sub { color: var(--muted); font-size: 12px; }
  .layout { display: flex; }
  .flow-wrap { flex: 1; padding: var(--space-5); overflow: auto; }
  .sidebar {
    width: 400px;
    border-left: 1px solid var(--border);
    background: var(--panel);
    padding: var(--space-4);
    overflow-y: auto;
    flex-shrink: 0;
    height: calc(100vh - 61px);
    position: sticky;
    top: 61px;
  }
  .sidebar h2 { font-size: 14px; margin: 0 0 var(--space-2); color: var(--accent); }
  .sidebar .placeholder { color: var(--muted); font-size: 13px; line-height: 1.5; margin-top: 40px; }
  .sidebar .status-line { font-size: 12px; color: var(--muted); margin-bottom: var(--space-3); }
  .sidebar pre {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: var(--space-3);
    font-size: 11px;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--text);
  }
  #flow { width: 100%; }
  .legend { display: flex; gap: 14px; padding: var(--space-3) var(--space-5); border-top: 1px solid var(--border); font-size: 11px; color: var(--muted); align-items: center; flex-wrap: wrap; }
  .legend .swatch { width: 10px; height: 10px; display: inline-block; border-radius: var(--radius-sm); margin-right: 5px; vertical-align: middle; }
</style>
</head>
<body>

<header>
  <h1 id="title">Cupertino Review Flow</h1>
  <span class="sub" id="subtitle"></span>
</header>

<div class="layout">
  <div class="flow-wrap" id="flowWrap"></div>
  <div class="sidebar" id="sidebar">
    <div class="placeholder">Click a stage to see its full persisted result.</div>
  </div>
</div>

<div class="legend" id="legend"></div>

<!--__D3_SUBSET__-->
<script type="module">
const d3 = window.d3;

// build_review_flow_html.py replaces everything from the marker onward on
// this line with the real JSON literal. Left unmodified (template opened
// directly), the fallback demo below is used instead.
const FLOW_DATA_RAW = /*__FLOW_DATA__*/ null;

const FLOW = FLOW_DATA_RAW || {
  stages: [
    { id: "backwards", label: "cupertino-backwards", lane: 0, status: "ran", content: { experienceStatement: "let a user undo any mistake without fear" } },
    { id: "focus", label: "cupertino-focus", lane: 0, status: "ran", content: { survivors: [{ name: "core flow" }] } },
    { id: "longevity", label: "cupertino-longevity", lane: 1, status: "ran", content: { verdict: "incremental, no rewrite risk" } },
    { id: "integrate", label: "cupertino-integrate", lane: 2, status: "ran", content: { verdict: "own this seam, do not delegate" } },
    { id: "council", label: "cupertino-council", lane: 0, status: "ran", content: { tensionLog: ["Usability > Reduction: kept the confirm step"] } },
    { id: "prototype", label: "cupertino-prototype", lane: 0, status: "skipped", content: { skipped: true, reason: "no empirical uncertainty identified for this scope" } },
    { id: "elevate", label: "cupertino-elevate", lane: 0, status: "not-run", content: null },
    { id: "unbox", label: "cupertino-unbox", lane: 0, status: "not-run", content: null },
    { id: "reveal", label: "cupertino-reveal", lane: 0, status: "not-run", content: null },
  ],
};

const ranCount = FLOW.stages.filter(s => s.status === 'ran').length;
const skippedCount = FLOW.stages.filter(s => s.status === 'skipped').length;
document.getElementById('title').textContent =
  'Cupertino Review Flow' + (FLOW_DATA_RAW ? '' : ' — (no data — template opened directly)');
document.getElementById('subtitle').textContent =
  ranCount + ' ran · ' + skippedCount + ' explicitly skipped · ' +
  (FLOW.stages.length - ranCount - skippedCount) + ' not reached';

function statusColor(status) {
  if (status === 'ran') return 'var(--status-good)';
  if (status === 'skipped') return 'var(--status-warn)';
  return 'var(--status-unknown)';
}

// Pure data prep -- returns the same {..., col} shape as before. This does
// NOT touch the DOM; the D3 data-join below is what turns it into SVG, so
// this function stays exactly as it was (it was never the problem the
// council verdict flagged).
//
// lane-0 stages each get their own column; longevity (lane 1) and
// integrate (lane 2) share the same column (a real parallel fork), so the
// column counter only advances once for that pair.
function assignColumns(stages) {
  let col = 0;
  let lastLane1Col = null;
  return stages.map(s => {
    if (s.lane === 1) {
      const c = col;
      lastLane1Col = c;
      col++;
      return { ...s, col: c };
    }
    if (s.lane === 2) {
      return { ...s, col: lastLane1Col !== null ? lastLane1Col : col };
    }
    const c = col;
    col++;
    return { ...s, col: c };
  });
}

// Also pure data prep: an array of [fromStage, toStage] pairs. Sequential
// lane-0 chain, skipping through the longevity/integrate column; plus the
// explicit fork (focus -> longevity, focus -> integrate) and merge
// (longevity -> council, integrate -> council).
function buildEdges(stages) {
  const byId = {};
  stages.forEach(s => byId[s.id] = s);
  const edges = [];
  const lane0 = stages.filter(s => s.lane === 0);
  for (let i = 0; i < lane0.length - 1; i++) {
    const a = lane0[i], b = lane0[i + 1];
    if (b.col - a.col > 1) {
      edges.push([a, byId['longevity']]);
      edges.push([a, byId['integrate']]);
      edges.push([byId['longevity'], b]);
      edges.push([byId['integrate'], b]);
    } else {
      edges.push([a, b]);
    }
  }
  return edges;
}

const COL_W = 150, NODE_W = 120, NODE_H = 44;
const LANE_Y = { 0: 90, 1: 40, 2: 140 };
const HEIGHT = 190;

function nodeCenter(s) {
  return { x: 20 + s.col * COL_W + NODE_W / 2, y: LANE_Y[s.lane] + NODE_H / 2 };
}

// The rendering layer: everything from here down is the part the council
// verdict actually required to change. Real d3 selection/data-join
// (d3.select(...).selectAll(...).data(...).join(...)) instead of manual
// document.createElementNS + appendChild loops.
function renderFlow(parent) {
  const stages = assignColumns(FLOW.stages);
  const edges = buildEdges(stages);
  const maxCol = Math.max(...stages.map(s => s.col));
  const width = (maxCol + 1) * COL_W + 40;

  const svg = d3.select(parent).append('svg')
    .attr('id', 'flow')
    .attr('viewBox', `0 0 ${width} ${HEIGHT}`);

  // Edges first so node rects paint on top of the connecting lines.
  svg.selectAll('line.edge')
    .data(edges)
    .join('line')
    .attr('class', 'edge')
    .attr('x1', d => nodeCenter(d[0]).x + NODE_W / 2 - 4)
    .attr('y1', d => nodeCenter(d[0]).y)
    .attr('x2', d => nodeCenter(d[1]).x - NODE_W / 2 + 4)
    .attr('y2', d => nodeCenter(d[1]).y)
    .attr('stroke', 'var(--border)')
    .attr('stroke-width', 2);

  const nodeSel = svg.selectAll('g.node')
    .data(stages, d => d.id)
    .join('g')
    .attr('class', 'node')
    .attr('transform', d => {
      const c = nodeCenter(d);
      return `translate(${c.x},${c.y})`;
    })
    .style('cursor', 'pointer')
    .on('click', (event, d) => selectStage(d));

  nodeSel.append('rect')
    .attr('x', -NODE_W / 2)
    .attr('y', -NODE_H / 2)
    .attr('width', NODE_W)
    .attr('height', NODE_H)
    .attr('rx', 6)
    .attr('fill', 'var(--panel-2)')
    .attr('stroke', d => statusColor(d.status))
    .attr('stroke-width', 2)
    .attr('stroke-dasharray', d => d.status === 'skipped' ? '4,3' : null)
    .attr('opacity', d => d.status === 'not-run' ? 0.4 : 1);

  nodeSel.append('text')
    .attr('text-anchor', 'middle')
    .attr('dy', 4)
    .attr('fill', 'var(--text)')
    .attr('font-size', 11)
    .text(d => d.label.replace('cupertino-', ''));
}

function selectStage(s) {
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '';
  sidebar.appendChild(Object.assign(document.createElement('h2'), { textContent: s.label }));
  const statusLine = document.createElement('div');
  statusLine.className = 'status-line';
  statusLine.innerHTML = 'status: <span style="color:' + statusColor(s.status) + '">' + s.status + '</span>';
  sidebar.appendChild(statusLine);
  if (s.content == null) {
    sidebar.appendChild(Object.assign(document.createElement('div'), {
      className: 'placeholder',
      textContent: 'Not reached yet in this run.',
    }));
    return;
  }
  const pre = document.createElement('pre');
  pre.textContent = JSON.stringify(s.content, null, 2);
  sidebar.appendChild(pre);
}

function renderLegend() {
  const legend = document.getElementById('legend');
  const items = [['ran', 'ran'], ['skipped', 'explicitly skipped'], ['not-run', 'not reached yet']];
  for (const [status, label] of items) {
    const span = document.createElement('span');
    const sw = document.createElement('span');
    sw.className = 'swatch';
    sw.style.background = statusColor(status);
    span.appendChild(sw);
    span.appendChild(document.createTextNode(label));
    legend.appendChild(span);
  }
}

renderFlow(document.getElementById('flowWrap'));
renderLegend();
</script>
</body>
</html>
