<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cupertino Review Flow</title>
<style>
  :root {
    --bg: #1e1e1e;
    --bg-panel: #252526;
    --bg-header: #2d2d2d;
    --text: #d4d4d4;
    --text-dim: #8a8a8a;
    --accent: #cc785c;
    --border: #3a3a3a;
    --ran: #4c8d5a;
    --skipped: #8a8536;
    --not-run: #555;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 14px;
  }
  header { padding: 16px 20px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; margin: 0 0 4px; font-weight: 600; color: var(--accent); }
  header .sub { color: var(--text-dim); font-size: 12px; }
  .layout { display: flex; }
  .flow-wrap { flex: 1; padding: 20px; overflow: auto; }
  .sidebar {
    width: 400px;
    border-left: 1px solid var(--border);
    background: var(--bg-panel);
    padding: 18px;
    overflow-y: auto;
    flex-shrink: 0;
    height: calc(100vh - 61px);
    position: sticky;
    top: 61px;
  }
  .sidebar h2 { font-size: 14px; margin: 0 0 8px; color: var(--accent); }
  .sidebar .placeholder { color: var(--text-dim); font-size: 13px; line-height: 1.5; margin-top: 40px; }
  .sidebar .status-line { font-size: 12px; color: var(--text-dim); margin-bottom: 10px; }
  .sidebar pre {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px;
    font-size: 11px;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--text);
  }
  #flow { width: 100%; }
  .legend { display: flex; gap: 14px; padding: 10px 20px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-dim); align-items: center; flex-wrap: wrap; }
  .legend .swatch { width: 10px; height: 10px; display: inline-block; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
</style>
</head>
<body>

<header>
  <h1 id="title">Cupertino Review Flow</h1>
  <span class="sub" id="subtitle"></span>
</header>

<div class="layout">
  <div class="flow-wrap" id="flowWrap"></div>
  <div class="sidebar" id="sidebar">
    <div class="placeholder">Click a stage to see its full persisted result.</div>
  </div>
</div>

<div class="legend" id="legend"></div>

<script>
// build_review_flow_html.py replaces everything from the marker onward on
// this line with the real JSON literal. Left unmodified (template opened
// directly), the fallback demo below is used instead.
const FLOW_DATA_RAW = /*__FLOW_DATA__*/ null;

const FLOW = FLOW_DATA_RAW || {
  stages: [
    { id: "backwards", label: "cupertino-backwards", lane: 0, status: "ran", content: { experienceStatement: "let a user undo any mistake without fear" } },
    { id: "focus", label: "cupertino-focus", lane: 0, status: "ran", content: { survivors: [{ name: "core flow" }] } },
    { id: "longevity", label: "cupertino-longevity", lane: 1, status: "ran", content: { verdict: "incremental, no rewrite risk" } },
    { id: "integrate", label: "cupertino-integrate", lane: 2, status: "ran", content: { verdict: "own this seam, do not delegate" } },
    { id: "council", label: "cupertino-council", lane: 0, status: "ran", content: { tensionLog: ["Usability > Reduction: kept the confirm step"] } },
    { id: "prototype", label: "cupertino-prototype", lane: 0, status: "skipped", content: { skipped: true, reason: "no empirical uncertainty identified for this scope" } },
    { id: "elevate", label: "cupertino-elevate", lane: 0, status: "not-run", content: null },
    { id: "unbox", label: "cupertino-unbox", lane: 0, status: "not-run", content: null },
    { id: "reveal", label: "cupertino-reveal", lane: 0, status: "not-run", content: null },
  ],
};

const ranCount = FLOW.stages.filter(s => s.status === 'ran').length;
const skippedCount = FLOW.stages.filter(s => s.status === 'skipped').length;
document.getElementById('title').textContent =
  'Cupertino Review Flow' + (FLOW_DATA_RAW ? '' : ' — (no data — template opened directly)');
document.getElementById('subtitle').textContent =
  ranCount + ' ran · ' + skippedCount + ' explicitly skipped · ' +
  (FLOW.stages.length - ranCount - skippedCount) + ' not reached';

function escapeHtml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function statusColor(status) {
  if (status === 'ran') return 'var(--ran)';
  if (status === 'skipped') return 'var(--skipped)';
  return 'var(--not-run)';
}

// Assign columns: lane-0 stages each get their own column; longevity(lane 1)
// and integrate(lane 2) share the same column (a real parallel fork), so the
// column counter only advances once for that pair.
function assignColumns(stages) {
  let col = 0;
  let lastLane1Col = null;
  return stages.map(s => {
    if (s.lane === 1) {
      const c = col;
      lastLane1Col = c;
      col++;
      return { ...s, col: c };
    }
    if (s.lane === 2) {
      // share the column with the immediately-preceding lane-1 stage
      return { ...s, col: lastLane1Col !== null ? lastLane1Col : col };
    }
    const c = col;
    col++;
    return { ...s, col: c };
  });
}

function renderFlow(parent) {
  const stages = assignColumns(FLOW.stages);
  const maxCol = Math.max(...stages.map(s => s.col));
  const colW = 150, nodeW = 120, nodeH = 44;
  const W = (maxCol + 1) * colW + 40;
  const laneY = { 0: 90, 1: 40, 2: 140 };
  const H = 190;

  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('id', 'flow');
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);

  function nodeCenter(s) {
    return { x: 20 + s.col * colW + nodeW / 2, y: laneY[s.lane] + nodeH / 2 };
  }

  // edges: sequential lane-0 chain, skipping through the longevity/integrate column;
  // plus explicit fork (focus -> longevity, focus -> integrate) and merge
  // (longevity -> council, integrate -> council).
  const byId = {};
  stages.forEach(s => byId[s.id] = s);
  const edges = [];
  const lane0 = stages.filter(s => s.lane === 0);
  for (let i = 0; i < lane0.length - 1; i++) {
    const a = lane0[i], b = lane0[i + 1];
    // if the next lane-0 stage's column isn't adjacent, the fork pair sits between them
    if (b.col - a.col > 1) {
      edges.push([a, byId['longevity']]);
      edges.push([a, byId['integrate']]);
      edges.push([byId['longevity'], b]);
      edges.push([byId['integrate'], b]);
    } else {
      edges.push([a, b]);
    }
  }

  for (const [a, b] of edges) {
    const ca = nodeCenter(a), cb = nodeCenter(b);
    const line = document.createElementNS(svgNS, 'line');
    line.setAttribute('x1', ca.x + nodeW / 2 - 4); line.setAttribute('y1', ca.y);
    line.setAttribute('x2', cb.x - nodeW / 2 + 4); line.setAttribute('y2', cb.y);
    line.setAttribute('stroke', 'var(--border)');
    line.setAttribute('stroke-width', '2');
    svg.appendChild(line);
  }

  for (const s of stages) {
    const c = nodeCenter(s);
    const x = c.x - nodeW / 2, y = c.y - nodeH / 2;
    const g = document.createElementNS(svgNS, 'g');
    g.style.cursor = 'pointer';
    const rect = document.createElementNS(svgNS, 'rect');
    rect.setAttribute('x', x); rect.setAttribute('y', y);
    rect.setAttribute('width', nodeW); rect.setAttribute('height', nodeH);
    rect.setAttribute('rx', 6);
    rect.setAttribute('fill', 'var(--bg-header)');
    rect.setAttribute('stroke', statusColor(s.status));
    rect.setAttribute('stroke-width', '2');
    if (s.status === 'skipped') rect.setAttribute('stroke-dasharray', '4,3');
    if (s.status === 'not-run') rect.setAttribute('opacity', '0.4');
    g.appendChild(rect);
    const text = document.createElementNS(svgNS, 'text');
    text.setAttribute('x', c.x); text.setAttribute('y', c.y + 4);
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('fill', 'var(--text)');
    text.setAttribute('font-size', '11');
    text.textContent = s.label.replace('cupertino-', '');
    g.appendChild(text);
    g.onclick = () => selectStage(s);
    svg.appendChild(g);
  }

  parent.appendChild(svg);
}

function selectStage(s) {
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '';
  sidebar.appendChild(Object.assign(document.createElement('h2'), { textContent: s.label }));
  const statusLine = document.createElement('div');
  statusLine.className = 'status-line';
  statusLine.innerHTML = 'status: <span style="color:' + statusColor(s.status) + '">' + s.status + '</span>';
  sidebar.appendChild(statusLine);
  if (s.content == null) {
    sidebar.appendChild(Object.assign(document.createElement('div'), {
      className: 'placeholder',
      textContent: 'Not reached yet in this run.',
    }));
    return;
  }
  const pre = document.createElement('pre');
  pre.textContent = JSON.stringify(s.content, null, 2);
  sidebar.appendChild(pre);
}

function renderLegend() {
  const legend = document.getElementById('legend');
  const items = [['ran', 'ran'], ['skipped', 'explicitly skipped'], ['not-run', 'not reached yet']];
  for (const [status, label] of items) {
    const span = document.createElement('span');
    const sw = document.createElement('span');
    sw.className = 'swatch';
    sw.style.background = statusColor(status);
    span.appendChild(sw);
    span.appendChild(document.createTextNode(label));
    legend.appendChild(span);
  }
}

renderFlow(document.getElementById('flowWrap'));
renderLegend();
</script>
</body>
</html>
