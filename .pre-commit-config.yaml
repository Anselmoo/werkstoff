default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/Anselmoo/repo-release-tools
    rev: v1.18.0
    hooks:
      - id: rrt-config-validate
      - id: rrt-doctor
      - id: rrt-branch-name

  # Local, deliberately, rather than biomejs/pre-commit. That hook runs biome
  # and only biome, so the rule set and the shrink-only baseline in biome.jsonc
  # would have to be expressed a second time, and the two assertions biome
  # cannot make on its own -- `node --check`, and the top-level-`return` shape
  # check that reads biome's parse refusal as its POSITIVE signal -- would not
  # run here at all. CI already calls this script directly
  # (.github/workflows/plugin-checks.yml, "Check workflow JS syntax"); this
  # keeps one code path rather than a second opinion that can drift from it.
  - repo: local
    hooks:
      - id: check-js-syntax
        name: workflow JS parses, has a top-level return, and is clean under biome
        entry: scripts/ci/check-js-syntax.sh
        language: script
        # `pass_filenames: false` is load-bearing, not laziness. The script does
        # its own discovery (`find plugins -path '*/workflows/*.js'`), and the
        # shape assertion is a property of the WHOLE set -- "all 15 carry a
        # top-level return". Handed a subset it would print that line about the
        # files that happened to change, which is a different and weaker claim.
        pass_filenames: false
        # Pinned explicitly. Left unset a hook runs in EVERY stage, and CI calls
        # pre-commit twice -- once plain, once `--hook-stage manual` for
        # rrt-doctor -- so both hooks below would run twice per CI job for no
        # extra signal. Stating the stage is also the lesson rrt-doctor taught
        # here in the other direction: its manifest pins it to `stages:
        # [manual]`, so it silently never ran under a plain `pre-commit run`.
        # An absence that is written down is a decision; one that is inferred
        # from a default is a bug waiting to be found.
        stages: [pre-commit]
        # biome.jsonc and the script itself are inputs, not just subjects: a
        # change to either changes what the check decides, so a commit touching
        # one must re-run it even when no workflow file moved.
        files: ^(plugins/[^/]+/workflows/.*\.js|biome\.jsonc|scripts/ci/check-js-syntax\.sh)$

      - id: check-js-syntax-selftest
        name: check-js-syntax calibrates itself (8 planted defects)
        entry: scripts/ci/check-js-syntax.sh
        args: [--selftest]
        language: script
        pass_filenames: false
        stages: [pre-commit]
        # Only when the instrument changes. CLAUDE.md's rule is to calibrate
        # before trusting a checker, and this is the cheapest place to hold that:
        # ~7s, paid by whoever edits the checker or its config, not by every
        # commit. `pre-commit run --all-files` in CI runs it every time.
        files: ^(scripts/ci/check-js-syntax\.sh|biome\.jsonc)$

      - id: check-workflow-models
        name: every workflow agent() model is valid (omitted inherits) and carries the relay briefing
        entry: python3 scripts/ci/check_workflow_models.py
        language: system
        # The count ("all N sites across M files") is a claim about the whole
        # set; handed a subset it would make a weaker one.
        pass_filenames: false
        stages: [pre-commit]
        files: ^(plugins/[^/]+/workflows/.*\.js|scripts/ci/check_workflow_models\.py)$

      - id: check-workflow-models-selftest
        name: check-workflow-models calibrates itself (planted defects)
        entry: python3 scripts/ci/check_workflow_models.py
        args: [--selftest]
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: ^scripts/ci/check_workflow_models\.py$

      - id: check-judge-contract
        name: vendored judge-contract copies match tools/judge-contract/ (JC-* rules)
        entry: python3 scripts/ci/check_judge_contract.py
        language: system
        # Like check-workflow-models, the verdict is about the whole set (every
        # REQUIRED workflow carries the block, every copy is byte-identical);
        # handed a subset it would make a weaker claim.
        pass_filenames: false
        stages: [pre-commit]
        files: ^(plugins/[^/]+/workflows/.*\.js|plugins/[^/]+/scripts/.*judge_contract\.py|plugins/[^/]+/references/judge-contract\.md|tools/judge-contract/.*|scripts/ci/check_judge_contract\.py)$

      - id: check-judge-contract-selftest
        name: check-judge-contract calibrates itself (planted defects)
        entry: python3 scripts/ci/check_judge_contract.py
        args: [--selftest]
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: ^(scripts/ci/check_judge_contract\.py|tools/judge-contract/.*)$

      - id: judge-contract-selftest
        name: judge_contract.py decides its own known answers
        entry: python3 tools/judge-contract/judge_contract.py
        args: [--selftest]
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: ^tools/judge-contract/.*$

      - id: judge-contract-parity
        name: Python and JS verdict implementations agree (needs node)
        entry: python3 tools/judge-contract/test_parity.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
        # node is already a hard requirement of check-js-syntax above, so this
        # hook adds no new tool to the environment.
        files: ^tools/judge-contract/.*$

      - id: judge-calibration-selftest
        name: the calibration scorer decides fabricated judges and sabotaged oracles correctly
        entry: python3 tools/judge-calibration/calibration.py
        args: [selftest]
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: ^(tools/judge-calibration/.*|tools/judge-contract/judge_contract\.py|test/judge-calibration/.*)$

      - id: paired-tribunal-measurement
        name: the paired tribunal measurement's items, keys, decision rule and vendored verdict block hold
        entry: sh -c 'python3 tools/judge-calibration/paired.py selftest && python3 tools/judge-calibration/paired.py check && python3 tools/judge-calibration/paired_v2.py selftest && python3 tools/judge-calibration/paired_v2.py check && python3 tools/judge-calibration/paired_v3.py selftest && python3 tools/judge-calibration/paired_v3.py check'
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: ^(tools/judge-calibration/.*|tools/judge-contract/(judge_contract\.py|verdict\.inline\.js)|test/judge-calibration/.*)$

      - id: check-judge-calibration
        name: judge calibration fixtures, keys, prompts and records agree
        entry: python3 tools/judge-calibration/calibration.py
        args: [check]
        language: system
        # The verdict is about every judge's whole set (balance, keys, records), so it
        # is never handed a subset of files.
        pass_filenames: false
        stages: [pre-commit]
        files: ^(tools/judge-calibration/.*|test/judge-calibration/.*|plugins/arbeitsplan/(workflows/run\.js|agents/candidate-referee\.md)|plugins/matrize/(workflows/decode\.js|agents/decode-referee\.md)|plugins/andon/(agents/andon-(defender|challenger|verifier|adjudicator)\.md|skills/andon-verify/references/tribunal-protocol\.md))$

      - id: check-design-tokens
        name: docs theme and report viewers use design tokens (shrink-only baseline)
        entry: python3 scripts/ci/check_design_tokens.py
        language: system
        # The script discovers its own scope; handed a subset it would report
        # every unlisted baseline entry as stale.
        pass_filenames: false
        stages: [pre-commit]
        files: ^(docs/\.vitepress/(theme/.*|config\.mjs)|plugins/[^/]+/assets/.*\.html|tools/design-tokens/tokens\.css|scripts/ci/(check_design_tokens\.py|design-tokens-baseline\.txt))$

      - id: check-design-tokens-selftest
        name: check-design-tokens calibrates itself (planted defects + rule sabotage)
        entry: python3 scripts/ci/check_design_tokens.py
        args: [--selftest]
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: ^scripts/ci/check_design_tokens\.py$
