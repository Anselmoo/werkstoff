<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Element card</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <article class="card">
    <img class="sample" src="sample.png">
    <div class="symbol">Fe</div>
    <h1 class="name">Iron</h1>

    </dl>
    <button class="more" onclick="alert('todo')">More</button>
  </article>
</body>
</html>
