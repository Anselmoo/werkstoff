<!doctype html>
<html><head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>drift — contract drift</title>
<style>
<!--__DESIGN_TOKENS__-->
.header { height: var(--header-h); }

</style>
</head><body>
<h1>drift — contract drift</h1>
<p class="verdict" id="verdict">Loading…</p>
<div class="legend">green = within budget · red = over (also marked ▲)</div>
<div id="body"></div>
<script>
const data = window.__DATA__;
const verdict = document.getElementById('verdict');
if (!data) { verdict.textContent = 'No data — re-run scripts/build_drift_html.py to regenerate.'; }
else {
  const n = data.rows.length;
  const overdue = data.rows.filter(r => r.overdue).length;
  verdict.textContent = overdue ? `${overdue} contracts drifted past their deadline.` : 'No contract has drifted.';
  const h = document.createElement('p'); h.textContent = `Total: ${n}`;
  const t = document.createElement('table');
  for (const r of data.rows) { const tr = t.insertRow(); tr.insertCell().textContent = r.name; const c = tr.insertCell(); c.className = 'muted'; c.textContent = r.overdue ? 'overdue' : 'ok'; }
  const foot = document.createElement('p'); foot.className = 'muted'; foot.textContent = `${n} rows · ${overdue} overdue`;
  document.getElementById('body').append(h, t, foot);
}
</script>
</body></html>
