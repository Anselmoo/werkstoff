# lib/ canary (issue #24): a real, committed file at the root of every
# plugin's scripts/lib/ package, so a `.gitignore` regression that swallows
# that directory again makes `rrt artifacts --check --strict` fail on the
# next fresh checkout instead of shipping silently for months. Add one more
# entry here (copy either of these two) when a new plugin gains its own
# scripts/lib/ package.

[[tool.rrt.artifact_targets]]
path = "plugins/self-assess/scripts/lib/README.md"
description = "self-assess's synced copy of tools/plugin-lib-canary/README.md"
command = ["cp", "tools/plugin-lib-canary/README.md", "plugins/self-assess/scripts/lib/README.md"]

[[tool.rrt.artifact_targets]]
path = "plugins/confab/scripts/lib/README.md"
description = "confab's synced copy of tools/plugin-lib-canary/README.md"
command = ["cp", "tools/plugin-lib-canary/README.md", "plugins/confab/scripts/lib/README.md"]

# Shared vendored D3 v7 subset (d3-hierarchy, d3-pack, d3-zoom, d3-interpolate,
# d3-ease), sourced from anthropics/claude-plugins-official's code-modernization
# topology-viewer.html (ISC License, Copyright Mike Bostock) -- self-contained,
# no CDN, same constraint every other self-assess/cli-scaffold HTML asset
# already follows. One source of truth, vendored the same way
# build_symbol_index.py is, so both consumers can never drift apart.
[[tool.rrt.artifact_targets]]
path = "plugins/self-assess/assets/inline-d3.html"
description = "self-assess's synced copy of tools/d3-subset/inline-d3.html"
command = ["cp", "tools/d3-subset/inline-d3.html", "plugins/self-assess/assets/inline-d3.html"]

[[tool.rrt.artifact_targets]]
path = "plugins/cli-scaffold/assets/inline-d3.html"
description = "cli-scaffold's synced copy of tools/d3-subset/inline-d3.html"
command = ["cp", "tools/d3-subset/inline-d3.html", "plugins/cli-scaffold/assets/inline-d3.html"]

# Shared design tokens (tools/design-tokens/tokens.css) -- canonical colors,
# typography, spacing, and motion values extracted from what all 5 existing
# report viewers were independently hand-copying into their own :root
# blocks (confirmed diverging: andon/confab/matrix used --bg-panel/--text-dim
# naming and a different font stack than cli-scaffold/self-assess's
# --panel/--muted naming). Vendored into all 7 report-viewer plugins,
# including cupertino and compass ahead of their own D3 rollout, so no
# future rebuild needs a separate artifact_targets addition just for tokens.

[[tool.rrt.artifact_targets]]
path = "plugins/andon/assets/tokens.css"
description = "andon's synced copy of tools/design-tokens/tokens.css"
command = ["cp", "tools/design-tokens/tokens.css", "plugins/andon/assets/tokens.css"]

