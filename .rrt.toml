# rrt (repo-release-tools) configuration for werkstoff.
#
# werkstoff bundles six independently-versioned Claude Code plugins
# (self-assess, confab, compass, cupertino, andon, cli-scaffold), each with
# its own plugins/<name>/.claude-plugin/plugin.json declaring its own
# "version", plus the werkstoff-cli installer tool under tools/werkstoff-cli/,
# versioned via its own pyproject.toml. `version_groups` lets rrt bump each
# unit's version independently (`rrt bump <bump> --group <name>`) rather than
# forcing one repo-wide version across all seven. Requires rrt >= 1.13.1 (see
# anselmoo/repo-release-tools#175 — fixed in #176 — for why anything older
# fails with "Multiple version groups configured" on a valid --group).

[[tool.rrt.version_groups]]
name = "self-assess"
release_branch = "release/self-assess/v{version}"
changelog_file = "plugins/self-assess/CHANGELOG.md"

  [[tool.rrt.version_groups.version_targets]]
  path = "plugins/self-assess/.claude-plugin/plugin.json"
  kind = "package_json"

[[tool.rrt.version_groups]]
name = "confab"
release_branch = "release/confab/v{version}"
changelog_file = "plugins/confab/CHANGELOG.md"

  [[tool.rrt.version_groups.version_targets]]
  path = "plugins/confab/.claude-plugin/plugin.json"
  kind = "package_json"

[[tool.rrt.version_groups]]
name = "compass"
release_branch = "release/compass/v{version}"
changelog_file = "plugins/compass/CHANGELOG.md"

  [[tool.rrt.version_groups.version_targets]]
  path = "plugins/compass/.claude-plugin/plugin.json"
  kind = "package_json"

[[tool.rrt.version_groups]]
name = "cupertino"
release_branch = "release/cupertino/v{version}"
changelog_file = "plugins/cupertino/CHANGELOG.md"

  [[tool.rrt.version_groups.version_targets]]
  path = "plugins/cupertino/.claude-plugin/plugin.json"
  kind = "package_json"

[[tool.rrt.version_groups]]
name = "andon"
release_branch = "release/andon/v{version}"
changelog_file = "plugins/andon/CHANGELOG.md"

  [[tool.rrt.version_groups.version_targets]]
  path = "plugins/andon/.claude-plugin/plugin.json"
  kind = "package_json"

[[tool.rrt.version_groups]]
name = "cli-scaffold"
release_branch = "release/cli-scaffold/v{version}"
changelog_file = "plugins/cli-scaffold/CHANGELOG.md"

  [[tool.rrt.version_groups.version_targets]]
  path = "plugins/cli-scaffold/.claude-plugin/plugin.json"
  kind = "package_json"

[[tool.rrt.version_groups]]
name = "werkstoff-cli"
release_branch = "release/werkstoff-cli/v{version}"
changelog_file = "tools/werkstoff-cli/CHANGELOG.md"

  [[tool.rrt.version_groups.version_targets]]
  path = "tools/werkstoff-cli/pyproject.toml"
  kind = "pep621"

# Field-level sync (rrt fields): each plugin's own plugin.json is the
# single source of truth for its description; the marketplace.json
# listing entry is a copy that must be kept in sync rather than hand-
# edited independently. Requires rrt with the `fields` command
# (anselmoo/repo-release-tools#178 / PR anselmoo/repo-release-tools#179 —
# not yet published at the time this was added; run from a local branch
# checkout via `uv run --project <path-to-repo-release-tools> rrt fields`
# until it ships in a release).

[[tool.rrt.field_targets]]
source = "plugins/self-assess/.claude-plugin/plugin.json"
source_field = "description"
targets = [
  { path = ".claude-plugin/marketplace.json", field = "plugins[name=self-assess].description" },
]

[[tool.rrt.field_targets]]
source = "plugins/confab/.claude-plugin/plugin.json"
source_field = "description"
targets = [
  { path = ".claude-plugin/marketplace.json", field = "plugins[name=confab].description" },
]

[[tool.rrt.field_targets]]
source = "plugins/compass/.claude-plugin/plugin.json"
source_field = "description"
targets = [
  { path = ".claude-plugin/marketplace.json", field = "plugins[name=compass].description" },
]

[[tool.rrt.field_targets]]
source = "plugins/cupertino/.claude-plugin/plugin.json"
source_field = "description"
targets = [
  { path = ".claude-plugin/marketplace.json", field = "plugins[name=cupertino].description" },
]

[[tool.rrt.field_targets]]
source = "plugins/andon/.claude-plugin/plugin.json"
source_field = "description"
targets = [
  { path = ".claude-plugin/marketplace.json", field = "plugins[name=andon].description" },
]

[[tool.rrt.field_targets]]
source = "plugins/cli-scaffold/.claude-plugin/plugin.json"
source_field = "description"
targets = [
  { path = ".claude-plugin/marketplace.json", field = "plugins[name=cli-scaffold].description" },
]

# Generated-copy tracking: build_symbol_index.py and the Parallel-Safe Research
# Protocol doc are maintained in tools/symbol-indexer/ as the master single
# source of truth. Each plugin's copy is a tracked artifact_target — regenerate
# with `rrt artifacts --regenerate` (runs each `command` then re-snapshots the
# hash lock), verify drift with `rrt artifacts --check`. (Note: there is no
# `[[tool.rrt.file_sync]]` config key in rrt — confirmed against the
# repo-release-tools docs; artifact_targets + command is the real mechanism.)

[[tool.rrt.artifact_targets]]
path = "plugins/self-assess/scripts/build_symbol_index.py"
description = "self-assess's synced copy of tools/symbol-indexer/build_symbol_index.py"
command = ["cp", "tools/symbol-indexer/build_symbol_index.py", "plugins/self-assess/scripts/build_symbol_index.py"]

[[tool.rrt.artifact_targets]]
path = "plugins/andon/scripts/build_symbol_index.py"
description = "andon's synced copy of tools/symbol-indexer/build_symbol_index.py"
command = ["cp", "tools/symbol-indexer/build_symbol_index.py", "plugins/andon/scripts/build_symbol_index.py"]

[[tool.rrt.artifact_targets]]
path = "plugins/compass/scripts/build_symbol_index.py"
description = "compass's synced copy of tools/symbol-indexer/build_symbol_index.py"
command = ["cp", "tools/symbol-indexer/build_symbol_index.py", "plugins/compass/scripts/build_symbol_index.py"]

[[tool.rrt.artifact_targets]]
path = "plugins/confab/scripts/build_symbol_index.py"
description = "confab's synced copy of tools/symbol-indexer/build_symbol_index.py"
command = ["cp", "tools/symbol-indexer/build_symbol_index.py", "plugins/confab/scripts/build_symbol_index.py"]

[[tool.rrt.artifact_targets]]
path = "plugins/cupertino/scripts/build_symbol_index.py"
description = "cupertino's synced copy of tools/symbol-indexer/build_symbol_index.py"
command = ["cp", "tools/symbol-indexer/build_symbol_index.py", "plugins/cupertino/scripts/build_symbol_index.py"]

[[tool.rrt.artifact_targets]]
path = "plugins/cli-scaffold/scripts/build_symbol_index.py"
description = "cli-scaffold's synced copy of tools/symbol-indexer/build_symbol_index.py"
command = ["cp", "tools/symbol-indexer/build_symbol_index.py", "plugins/cli-scaffold/scripts/build_symbol_index.py"]

[[tool.rrt.artifact_targets]]
path = "plugins/self-assess/references/parallel-safe-research-protocol.md"
description = "self-assess's synced copy of tools/symbol-indexer/parallel-safe-research-protocol.md"
command = ["cp", "tools/symbol-indexer/parallel-safe-research-protocol.md", "plugins/self-assess/references/parallel-safe-research-protocol.md"]

[[tool.rrt.artifact_targets]]
path = "plugins/andon/references/parallel-safe-research-protocol.md"
