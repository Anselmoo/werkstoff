# rrt (repo-release-tools) configuration for werkstoff.
#
# Thirteen independently-versioned units: twelve plugins under plugins/<name>/ (each
# with its own .claude-plugin/plugin.json) plus the werkstoff-cli installer
# under tools/werkstoff-cli/ (pyproject.toml). There is deliberately NO
# repo-wide version — bump one unit with `rrt bump <bump> --group <name>`.
#
# Requires rrt >= 1.13.1; older versions fail with "Multiple version groups
# configured" on a valid --group (anselmoo/repo-release-tools#175, fixed #176).
#
# TAGGING: plugins MUST use `rrt tag create --group <n> --prefix '<n>-v' --push`.
# A bare v<version> tag fires .github/workflows/cicd.yml, which always publishes
# tools/werkstoff-cli regardless of intent. Only werkstoff-cli uses the bare
# scheme.

[[tool.rrt.version_groups]]
name = "befund"
release_branch = "release/befund/v{version}"
changelog_file = "plugins/befund/CHANGELOG.md"

  [[tool.rrt.version_groups.version_targets]]
  path = "plugins/befund/.claude-plugin/plugin.json"
  kind = "package_json"

[[tool.rrt.version_groups]]
name = "zeugnis"
release_branch = "release/zeugnis/v{version}"
changelog_file = "plugins/zeugnis/CHANGELOG.md"

  [[tool.rrt.version_groups.version_targets]]
  path = "plugins/zeugnis/.claude-plugin/plugin.json"
  kind = "package_json"

