# Partially-standardized README section: the "## Example Prompts" heading and its
# framing sentence are enforced identically across all six plugin READMEs via
# `rrt docs inject` (see CLAUDE.md). The example bullets under the anchor stay
# plugin-specific and hand-written — only the frame is synced, never the content.
[[tool.rrt.docs.shared_blocks]]
anchor_id = "example-prompts-intro"
content = """## Example Prompts

Say any of these to Claude Code once the plugin is installed — they're plain-language
prompts, not exact phrasing Claude has to match. Claude routes them to the skill below
by intent.
"""
before_blank_lines = 0
after_blank_lines = 1
targets = ["plugins/*/README.md"]

# Generated-copy tracking: build_symbol_index.py and the Parallel-Safe Research
# Protocol doc are maintained in tools/symbol-indexer/ as the master single
# source of truth. Each plugin's copy is a tracked artifact_target — regenerate
# with `rrt artifacts --regenerate` (runs each `command` then re-snapshots the
# hash lock), verify drift with `rrt artifacts --check`. (Note: there is no
# `[[tool.rrt.file_sync]]` config key in rrt — confirmed against the
# repo-release-tools docs; artifact_targets + command is the real mechanism.)

[[tool.rrt.artifact_targets]]
path = "plugins/befund/scripts/build_symbol_index.py"
description = "befund's synced copy of tools/symbol-indexer/build_symbol_index.py"
command = ["cp", "tools/symbol-indexer/build_symbol_index.py", "plugins/befund/scripts/build_symbol_index.py"]

[[tool.rrt.artifact_targets]]
path = "plugins/andon/scripts/build_symbol_index.py"
description = "andon's synced copy of tools/symbol-indexer/build_symbol_index.py"
