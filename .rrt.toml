command = ["python3", "tools/surface-index/build_surface_index.py"]

# The docs site embeds each plugin README verbatim via `<!--@include:-->`, so every
# screenshot a README references has to exist a second time under docs/plugins/assets/.
# Those copies were made by hand and synced by nothing: this PR added three viewers and
# forgot three copies, and the VitePress build failed with "Could not resolve
# ./assets/beatgraph-viewer-screenshot.jpg" -- naming only the first of the three.
# Tracking them here makes `rrt artifacts --check --strict`, already a CI step, the thing
# that notices. Add an entry when a plugin gains a screenshot.

[[tool.rrt.artifact_targets]]
path = "docs/plugins/assets/architecture-tree-viewer-screenshot.jpg"
description = "docs copy of plugins/cli-scaffold/assets/architecture-tree-viewer-screenshot.jpg"
command = ["cp", "plugins/cli-scaffold/assets/architecture-tree-viewer-screenshot.jpg", "docs/plugins/assets/architecture-tree-viewer-screenshot.jpg"]

[[tool.rrt.artifact_targets]]
path = "docs/plugins/assets/beatgraph-viewer-screenshot.jpg"
description = "docs copy of plugins/takt/assets/beatgraph-viewer-screenshot.jpg"
command = ["cp", "plugins/takt/assets/beatgraph-viewer-screenshot.jpg", "docs/plugins/assets/beatgraph-viewer-screenshot.jpg"]

