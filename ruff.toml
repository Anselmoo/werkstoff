# Repo-root ruff config.
#
# This file exists to widen `ruff check` from tools/werkstoff-cli (the only
# place CI ever linted -- see .github/workflows/cicd.yml's `defaults.run.
# working-directory`) to the whole repo. That's a SCOPE change, not a bar
# raise.
#
# tools/werkstoff-cli/pyproject.toml's [tool.ruff] selects a broader, stricter
# set ("E","F","I","UP","B" with line-length=100) tailored to that one polished
# package. Copying it verbatim here was tried and rejected: against the rest of
# the repo it raises the finding count from a handful to 700+ (550 of them E501
# alone, from repo-wide scripts nobody has ever formatted to a 100-column
# limit), which would bury the real defects in reformatting noise. The CLI
# package keeps its own stricter config in its own pyproject.toml, untouched.
#
# WHY `select` IS SPELLED OUT RATHER THAN LEFT TO "ruff's defaults":
# because ruff's defaults are NOT stable across versions, and leaving them
# implicit made CI fail on a commit that changed nothing relevant. This file
# originally set no `select` at all, and the CI step ran unpinned `uvx ruff`,
# which resolved to 0.16.6 -- whose default rule set is far broader than
# 0.15's, additionally enabling EXE001, UP, RUF, SIM, PLW, BLE and I001. Same
# commit, same config: 0 findings under 0.15.22, 325 under 0.16.6. A rule set
# that changes when an unrelated tool cuts a release is not a decision this
# repo ever made, so the decision is written down here instead. These four ARE
# ruff's historical defaults (pyflakes, plus pycodestyle's syntax, statement
# and indentation errors); the point is that they no longer depend on which
# ruff happens to run.

target-version = "py312"

# test/plugins/fixtures/ holds deliberately-defective test fixtures, not real
# source: e.g. test/plugins/fixtures/lehre-unparseable/src/broken.py contains
# `def broken(:` -- a syntax error that IS the fixture -- and
# test/plugins/fixtures/lehre-fidelity-gap/src/adapters/base.py has an
# intentionally unused import. Linting (or "fixing") either destroys the test
# it exists to support. Do not remove this exclusion.
#
# NOTE ON ORDERING: this key and `target-version` are TOP-LEVEL and must stay
# above the [lint] table. TOML puts every key after a table header inside that
# table, and `lint.extend-exclude` does not exist -- ruff then refuses to load
# the file at all. That mistake was made here once and caught only because a
# deliberately-broken probe file went undetected; a `--quiet` run had reported
# it as "passing" while ruff was in fact scanning nothing.
extend-exclude = ["test/plugins/fixtures"]

[lint]
# The first four are the historical baseline (see the header). The rest were
# added when `Path` over `os.path` became a stated convention, and they are
# NOT a uniform bar raise -- see the shrink-only baseline below.
#
#   PTH      pathlib over os.path. The convention this block exists for.
#   UP       pyupgrade. UP031 in particular: printf-style `%` formatting is
#            named in CLAUDE.md's defect table -- `PROMPT % (...)` with a
#            literal `%` in the text raised TypeError, and the stale output was
#            then read as a fresh result.
#   B904     `raise` inside `except` without `from`, which drops the cause. In
#            a fail-closed guard the cause IS the diagnostic.
#   SIM115   a file opened without a context manager; the handle leaks.
#   RUF100   a `noqa` that suppresses nothing. There were 95 of these: comments
#            asserting "known exception here" against rules never enabled --
#            the "looks correct and silently does nothing" family exactly.
#   DTZ      naive datetimes. Currently clean; enabled to keep it that way.
select = ["E4", "E7", "E9", "F", "PTH", "UP", "B904", "SIM115", "RUF100", "DTZ"]

# SHRINK-ONLY BASELINE.
#
# The rules above are the standard for NEW code. Applying them to what already
# exists means ~966 findings across ten plugins, which would bury real defects
# in reformatting noise -- the same argument the header makes for not copying
# the CLI package's stricter config wholesale.
#
# So: every directory that was already non-conforming when the convention
# landed is listed here with its count at that moment. This list may only
# SHRINK. Adding a path, or raising a number, means new code was written
# against the old convention -- fix the code instead. Same discipline as
# test/plugins/tag-releases-baseline.txt, for the same reason: a baseline that
# can grow is not a baseline, it is a suggestion.
#
# `takt` and `arbeitsplan` are deliberately ABSENT: both are at zero and must
# stay there. A new plugin starts absent too.
[lint.per-file-ignores]
"plugins/cli-scaffold/**"         = ["PTH", "UP", "B904", "SIM115", "RUF100", "DTZ"]  # 230
"plugins/confab/**"               = ["PTH", "UP", "B904", "SIM115", "RUF100", "DTZ"]  # 209
"plugins/self-assess/**"          = ["PTH", "UP", "B904", "SIM115", "RUF100", "DTZ"]  # 123
"plugins/compass/**"              = ["PTH", "UP", "B904", "SIM115", "RUF100", "DTZ"]  #  89
"plugins/nacharbeit/**"           = ["PTH", "UP", "B904", "SIM115", "RUF100", "DTZ"]  #  87
"plugins/lehre/**"                = ["PTH", "UP", "B904", "SIM115", "RUF100", "DTZ"]  #  76
"plugins/andon/**"                = ["PTH", "UP", "B904", "SIM115", "RUF100", "DTZ"]  #  66
"plugins/cupertino/**"            = ["PTH", "UP", "B904", "SIM115", "RUF100", "DTZ"]  #  58
"plugins/matrize/**"              = ["PTH", "UP", "B904", "SIM115", "RUF100", "DTZ"]  #  16
"plugins/codebase-consistency/**" = ["PTH", "UP", "B904", "SIM115", "RUF100", "DTZ"]  #  12
"scripts/**"                      = ["PTH", "UP", "B904", "SIM115", "RUF100", "DTZ"]  #  29
"tools/**"                        = ["PTH", "UP", "B904", "SIM115", "RUF100", "DTZ"]  #  11
"test/**"                         = ["PTH", "UP", "B904", "SIM115", "RUF100", "DTZ"]  #   2
