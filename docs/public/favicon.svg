<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="t">
  <title id="t">werkstoff</title>
  <!-- Simplified for 16px: full-bleed plate, heavier stroke, larger node. The
       1.5px border and the plate inset of logo.svg both disappear at this size,
       so they are dropped rather than rendered as mud. -->
  <!-- Node placement is measured, not eyeballed: (23.5,11) r=2.9 with a 1.4
       ring leaves ~4.9 units of clearance from the rx=7 corner arc (was ~1.8
       at the old (26,10) r=3.4/1.6, crowded enough to read as clipped in a
       true 16x16 raster test). The two outer verticals sit level at y=11 and
       mirror around x=16, so the W silhouette is symmetric before the node
       pulls the right terminal in for that clearance. -->
  <!-- prefers-color-scheme here is the browser's own chrome (tab strip, app
       switcher), not this site's .dark class: a fixed dark plate reads fine
       against a light tab bar but disappears into a dark one. Dark chrome
       therefore gets a light plate instead, using the exact deep accent steps
       tools/design-tokens/tokens.css and werkstoff.css already calibrated for
       AA contrast on a light background, so this stays one palette, not two. -->
  <style>
    .plate { fill: #141a1f; }
    .mark { stroke: #73b6fa; }
    .node { fill: #cfb656; stroke: #141a1f; }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #eef1f3; }
      .mark { stroke: #005a9d; }
      .node { fill: #746005; stroke: #eef1f3; }
    }
  </style>
  <rect class="plate" width="32" height="32" rx="7"/>
  <path class="mark" d="M8.5 11 L12.25 22 L16 12 L19.75 22 L23.5 11"
        fill="none" stroke-width="3.75"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="node" cx="23.5" cy="11" r="2.9" stroke-width="1.4"/>
</svg>
