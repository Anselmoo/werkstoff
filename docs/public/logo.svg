<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="t">
  <title id="t">werkstoff</title>
  <!-- Dark plate: reads as a chip on both a light and a dark page, so one mark
       serves both colour schemes. Colours are tools/design-tokens/tokens.css: silica (the scattered
       blue) and samaria (the transmitted warmth), the two poles of the aerogel duality. -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="7"
        fill="#141a1f" stroke="#28323a" stroke-width="1.5"/>
  <!-- A W that is also a value stream: down, up, down, up. The stroke is the
       run; it terminates at the gold node rather than continuing, which is the
       halt this project is built around. -->
  <path d="M7 10 L11.5 22 L16 13 L20.5 22 L25 10"
        fill="none" stroke="#348ad9" stroke-width="2.75"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="25" cy="10" r="2.9" fill="#cfb656" stroke="#141a1f" stroke-width="1.5"/>
</svg>
